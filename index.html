<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>老师 · 互动叙事</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    color-scheme:dark;
    --bg:#0d0f11;
    --paper:#111315;
    --ink:#e0dcd2;
    --dim:#a29d93;
    --dim2:#88837a;
    --accent:#c3a676;
    --line:rgba(224,220,210,.13);
    --line-strong:rgba(195,166,118,.44);
    --serif:"SimSun","宋体","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;min-height:100dvh;background-color:#090b0d;transition:background-color 3.2s ease}
  body{
    background:
      radial-gradient(70% 50% at 78% 0%,rgba(195,166,118,.065),transparent 72%),
      radial-gradient(65% 55% at 0% 100%,rgba(76,91,101,.07),transparent 76%),
      #090b0d;
    color:var(--ink);overflow:hidden;font-family:var(--serif);
    
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(115% 100% at 50% 45%,transparent 42%,rgba(0,0,0,.52) 100%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.2) 4px);
  }
  button{font-family:inherit}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  #app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
       width:100%;max-width:680px;margin:0 auto;padding-top:env(safe-area-inset-top);
       padding-bottom:calc(env(safe-area-inset-bottom) + 78px);
       background:linear-gradient(90deg,rgba(255,255,255,.008),rgba(255,255,255,.022) 50%,rgba(255,255,255,.008));
       box-shadow:0 0 80px rgba(0,0,0,.32)}

  .progress{height:2px;background:rgba(224,220,210,.06);flex:none}
  .progress i{display:block;height:100%;width:0;background:var(--accent);opacity:.82;
              transition:width .36s ease-out}

  header{display:flex;align-items:center;gap:16px;padding:23px 34px 8px;flex:none;min-height:58px}
  .clock{font-family:var(--mono);font-size:12px;letter-spacing:.2em;
         color:var(--accent);opacity:0;transition:opacity .45s ease-out;flex:none}
  .clock.on{opacity:.9}
  .chap{flex:1;text-align:right;font-size:11px;letter-spacing:.22em;color:var(--dim2);
        opacity:0;transition:opacity .45s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chap.on{opacity:1}

  .statusbar{display:flex;gap:22px;padding:0 34px;height:0;overflow:hidden;flex:none;
             opacity:0;transition:height .25s ease-out,opacity .25s ease-out}
  .statusbar.on{height:30px;opacity:1}
  .sitem{font-size:11px;letter-spacing:.12em;color:var(--dim2);display:flex;gap:7px;align-items:baseline}
  .sitem b{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:400}
  .sitem .heart{color:var(--accent)}

  #stage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
         padding:28px 34px 10px;scrollbar-width:none}
  #stage::-webkit-scrollbar{width:0;height:0;display:none}
  #text{max-width:34em;margin:0 auto}
  #text p,#measure p{
    margin:0 0 1.25em;font-size:clamp(16px,4.4vw,18.5px);line-height:2.08;
    letter-spacing:.035em;overflow-wrap:anywhere;text-align:left;
  }
  #text p:last-child{margin-bottom:0}
  #text.chapter-start p:first-child::first-letter,#measure.chapter-start p:first-child::first-letter{
    float:left;font-size:2.15em;line-height:1;padding:.18em .18em 0 0;color:var(--accent);
  }
  #text .em{color:var(--accent)}
  #text .sep,#measure .sep{margin:1.9em 0 2.1em;text-align:center;color:var(--dim2);
        letter-spacing:.8em;font-size:11px;line-height:1;user-select:none;opacity:.7}
  #measure{position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none}

  #hint{display:flex;align-items:center;justify-content:center;min-height:50px;
        text-align:center;font-size:11px;letter-spacing:.22em;color:var(--dim2);
        padding:9px 16px 14px;opacity:0;transition:opacity .25s ease-out;pointer-events:none}
  #hint.on{opacity:.82;animation:breathe 3.4s ease-in-out infinite;pointer-events:auto;cursor:pointer}
  #hint::before,#hint::after{content:"";width:24px;height:1px;background:var(--dim2);opacity:.38}
  #hint::before{margin-right:14px}
  #hint::after{margin-left:14px}
  @keyframes breathe{0%,100%{opacity:.42}50%{opacity:.82}}

  #choices{display:flex;flex-direction:column;gap:11px;padding:0 30px 22px;flex:none;
           max-height:45dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
           scrollbar-color:var(--line) transparent}
  #choices:empty{display:none}
  .choice{position:relative;display:flex;gap:14px;align-items:flex-start;width:100%;min-height:56px;text-align:left;
          font:inherit;font-size:15px;line-height:1.72;color:var(--ink);
          background:linear-gradient(105deg,rgba(224,220,210,.045),rgba(224,220,210,.018));
          border:1px solid var(--line);border-radius:3px;padding:15px 18px;cursor:pointer;touch-action:manipulation;
          transition:background-color .18s ease-out,border-color .18s ease-out,color .18s ease-out,transform .18s ease-out;
          animation:cIn .26s ease-out both}
  @keyframes cIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .choice .k{flex:none;width:24px;height:23px;margin-top:2px;display:flex;align-items:center;justify-content:center;
             font-family:var(--mono);font-size:11px;color:var(--accent);
             border:0;border-right:1px solid var(--line);border-radius:0;transition:inherit}
  .choice .t{min-width:0;overflow-wrap:anywhere}
  .choice:hover{background:rgba(195,166,118,.075);border-color:var(--line-strong);transform:translateX(3px)}
  .choice:active{background:rgba(195,166,118,.11);transform:scale(.995)}
  .choice.ghost{background:transparent;border-color:transparent;color:var(--dim2);
                justify-content:center;font-size:12px;letter-spacing:.12em;min-height:44px}
  .choice.ghost:hover{color:var(--ink);border-color:var(--line);background:rgba(224,220,210,.025);transform:none}

  .probeHint{font-family:var(--serif);font-size:14px;color:var(--dim);letter-spacing:.12em;margin:0 0 1.1em;text-align:left}

  /* 音乐按钮 */
  #music{position:fixed;z-index:40;left:22px;bottom:calc(env(safe-area-inset-bottom) + 18px);
         width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         background:rgba(13,15,17,.86);border:1px solid var(--line);cursor:pointer;
         color:var(--dim);transition:color .18s ease-out,border-color .18s ease-out,background-color .18s ease-out;
         backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #music:hover{color:var(--accent);border-color:var(--line-strong);background:var(--paper)}
  #music:active{background:rgba(195,166,118,.1)}
  #music.hidden{display:none}
  #music svg{width:16px;height:16px;display:block}

  .overlay{position:fixed;inset:0;z-index:50;
           background:
             radial-gradient(65% 48% at 72% 22%,rgba(195,166,118,.065),transparent 74%),
             linear-gradient(135deg,rgba(255,255,255,.018),transparent 48%),rgba(10,12,14,.99);
           backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
           display:flex;flex-direction:column;justify-content:center;
           padding:calc(env(safe-area-inset-top) + 40px) 42px calc(env(safe-area-inset-bottom) + 40px);
           max-width:680px;margin:0 auto;width:100%;overflow-y:auto;overscroll-behavior:contain}
  .overlay.hidden{display:none}

  .eyebrow{display:flex;align-items:center;gap:14px;font-size:10px;line-height:1.8;
           letter-spacing:.26em;color:var(--dim2);margin-bottom:30px}
  .eyebrow::before{content:"";width:30px;height:1px;flex:none;background:var(--accent);opacity:.7}
  .title{font-family:var(--serif);font-size:clamp(54px,12vw,82px);font-weight:400;
         letter-spacing:.22em;line-height:1.12;margin:0 0 26px;color:#e8e2d6}
  .title::after{content:"";display:block;width:46px;height:1px;margin-top:30px;background:var(--accent);opacity:.62}
  .sub{font-size:14px;line-height:2.1;letter-spacing:.025em;color:var(--dim);max-width:26em;margin:0 0 38px}
  .tbtns{display:flex;flex-direction:column;gap:12px;width:min(100%,320px)}
  .mhint{margin:14px 0 0;appearance:none;background:none;border:none;padding:10px 0;min-height:44px;
         font:inherit;font-size:12px;line-height:1.8;letter-spacing:.06em;color:var(--dim2);
         cursor:pointer;text-align:left;display:block;transition:color .18s ease-out}
  .mhint:hover{color:var(--accent)}
  .mhint.hidden{display:none}
  .credit{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);max-width:320px;
          font-size:10px;line-height:1.9;letter-spacing:.04em;color:var(--dim2);opacity:.86}
  .big{appearance:none;font:inherit;font-size:14px;font-weight:600;letter-spacing:.16em;min-height:52px;
       padding:14px 22px;border-radius:3px;cursor:pointer;
       border:1px solid var(--accent);background:var(--accent);color:#171816;
       transition:background-color .18s ease-out,border-color .18s ease-out,color .18s ease-out,transform .18s ease-out;
       touch-action:manipulation}
  .big:hover{background:#d0b485;border-color:#d0b485;transform:translateY(-1px)}
  .big:active{background:#b89a6b;transform:translateY(0)}
  .big.ghost{background:transparent;border-color:var(--line);color:var(--dim);font-weight:400}
  .big.ghost:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(195,166,118,.045)}

  #endingText{font-family:var(--serif);font-size:16px;line-height:2.1;color:var(--dim);margin:0 0 30px}

  #inter{display:flex;align-items:center;justify-content:center;background:var(--bg);cursor:pointer}
  #inter.hidden{display:none}
  #inter .num{font-size:11px;letter-spacing:.3em;color:var(--dim2);text-align:center;margin-bottom:22px}
  #inter .name{font-family:var(--serif);font-size:clamp(40px,11vw,54px);font-weight:400;
               letter-spacing:.3em;color:#e8e2d6;text-align:center;margin:0}
  #inter .inner{position:relative;padding:34px 44px;animation:iIn .45s ease-out both}
  #inter .inner::before,#inter .inner::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--line)}
  #inter .inner::before{top:0}
  #inter .inner::after{bottom:0}
  @keyframes iIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* 回退按钮 */
  #back{position:fixed;z-index:40;left:0;top:50%;transform:translateY(-50%);
        width:44px;height:68px;border-radius:0 3px 3px 0;
        background:rgba(13,15,17,.72);border:1px solid var(--line);border-left:none;
        color:var(--dim);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
        cursor:pointer;opacity:0;transition:opacity .18s ease-out,color .18s ease-out,background-color .18s ease-out;
        pointer-events:none;padding:0;touch-action:manipulation}
  #back.on{opacity:.48;pointer-events:auto}
  #back:hover,#back:focus-visible{opacity:1;color:var(--accent);background:var(--paper)}
  #back:active{opacity:1;background:rgba(195,166,118,.1)}

  @media (min-width:720px){
    #app,.overlay{border-left:1px solid rgba(224,220,210,.07);border-right:1px solid rgba(224,220,210,.07)}
  }
  /* 隐藏 Netlify 免费版角标（实验性） */
  iframe[src*="netlify.com"], iframe[src*="netlify.app"],
  #netlify-badge, .netlify-badge, [data-netlify-badge] { display:none !important; }

  @media (max-width:420px){
    #app{padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
    #stage{padding:22px 24px 8px}
    #text p,#measure p{line-height:2.04;letter-spacing:.025em}
    #text.chapter-start p:first-child::first-letter,#measure.chapter-start p:first-child::first-letter{font-size:2em}
    #choices{padding:0 18px 18px;max-height:47dvh}
    header{padding:19px 24px 6px;min-height:54px}
    .statusbar{padding:0 24px}
    .overlay{padding:calc(env(safe-area-inset-top) + 30px) 26px calc(env(safe-area-inset-bottom) + 30px)}
    .eyebrow{margin-bottom:26px;letter-spacing:.2em}
    .title{letter-spacing:.18em}
    .title::after{margin-top:24px}
    #music{left:16px;bottom:calc(env(safe-area-inset-bottom) + 14px)}
  }
  @media (max-height:560px){
    .overlay{justify-content:flex-start}
    .eyebrow{margin-bottom:18px}
    .title::after{margin-top:18px}
    .sub{margin-bottom:24px}
    .credit{margin-top:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }

  .cbar{display:inline-block;width:54px;height:3px;border-radius:2px;overflow:hidden;
        background:rgba(255,255,255,.10);vertical-align:middle;margin-left:3px;
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .cbar > b{display:block;height:100%;width:100%;border-radius:2px;
        background:linear-gradient(90deg,rgba(201,164,105,.45),rgba(214,181,126,.95));
        transition:width .8s cubic-bezier(.2,.8,.3,1)}

  /* 好感闪动 */
  @keyframes heartFlash{0%{opacity:1;transform:scale(1)}32%{opacity:.25;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
  .heart{display:inline-block;transform-origin:50% 55%}
  .heart.flash{animation:heartFlash .52s ease-out}

  /* 选项固定底色，不跟着背景色温变黄 */
  .choice{background-color:#0c0e10}

  /* 目录 */
  #toc{padding:6vh 26px}
  #toc .toclist{width:100%;max-height:58dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:16px 0 10px;
        scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
  #toc .tocitem{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;font:inherit;font-size:14.5px;
        color:var(--ink);background:rgba(18,20,23,.9);border:1px solid var(--line);border-radius:3px;
        padding:11px 16px;cursor:pointer;transition:border-color .18s,background-color .18s}
  #toc .tocitem:hover{border-color:var(--line-strong);background:rgba(28,31,35,.95)}
  #toc .tocnum{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.12em;flex:none;opacity:.85}
  #toc .tocnow{margin-left:auto;font-size:10px;color:var(--dim2);letter-spacing:.14em;flex:none}
</style>
</head>
<body>

<div id="app">
  <div class="progress"><i id="bar"></i></div>
  <header>
    <span class="clock" id="clock">--:--</span>
    <span class="chap" id="chapLabel"></span>
  </header>
  <div class="statusbar" id="statusbar">
    <span class="sitem">好感 <b class="heart">100</b></span>
    <span class="sitem">克制 <i class="cbar"><b id="cFill"></b></i></span>
  </div>
  <main id="stage"><div id="text"></div></main>
  <div id="hint">轻触继续</div>
  <footer id="choices"></footer>
</div>

<button id="back" type="button" aria-label="上一页">‹</button>

<div id="measure"></div>

<button id="music" class="hidden" type="button" aria-label="背景音乐">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9v6h3.5L12 19V5L7.5 9H4z"/>
    <path id="wave1" d="M15.5 8.5a5 5 0 0 1 0 7"/>
    <path id="wave2" d="M18.2 6.2a8.5 8.5 0 0 1 0 11.6"/>
    <path id="slash" d="M3 3l18 18" style="display:none"/>
  </svg>
</button>


<div class="overlay hidden" id="toc">
  <div class="eyebrow">目录</div>
  <div class="toclist" id="tocList"></div>
  <div class="tbtns">
    <button class="big ghost" id="btnTocBack" type="button">返回</button>
  </div>

":null,"st":0,"fx":null},{"k":"p","t":"“有人吗？”","time":null,"st":0,"fx":null},{"k":"p","t":"第一声太小，几乎没穿过这间卧室。","time":null,"st":0,"fx":null},{"k":"p","t":"你清了清嗓子，又尝试了一次：“有没有人？外面有人没有？”","time":null,"st":0,"fx":null},{"k":"p","t":"最后几个字挤在一起，几乎连不成句。","time":null,"st":0,"fx":null},{"k":"p","t":"手臂上的力气回来了些，嘴里却越来越苦，舔了舔嘴唇，只有汗的咸味。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"没人回答。","time":null,"st":0,"fx":null},{"k":"p","t":"等了一会儿，你把喊声拔高：“我被锁住了！你听见没有？”","time":null,"st":0,"fx":null},{"k":"p","t":"你不知道在向谁求救，也不知道会不会把锁你的人喊回来。","time":null,"st":0,"fx":null},{"k":"p","t":"暖气里有水经过，轻响只沿着墙走了一小段。","time":null,"st":0,"fx":null},{"k":"p","t":"床单被在手心里被你抓得发皱，耳朵还在等外面的一点动静。","time":null,"st":0,"fx":null},{"k":"p","t":"终于，门外响起了脚步。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"脚步在门外停下。","time":"03:20","st":1,"fx":null},{"k":"p","t":"门开了，台灯随之亮起，刺得人偏过头。","time":null,"st":0,"fx":null},{"k":"p","t":"眼睛还没适应，手已经去拢敞开的领口，意识到自己还在意这个，你脸上不合时宜的热了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"光亮里，一个虎兽人端着托盘走进来。","time":null,"st":0,"fx":null},{"k":"p","t":"灰橘色的毛，耳尖和尾巴上有深纹，看着已经不是高中生的年纪，进门时却收着肩，脚步也放的很轻。","time":null,"st":0,"fx":null},{"k":"p","t":"那只老虎在床边站定，没有说你为什么会在这里，也没有说那条链子是怎么回事。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他的目光先落在你脸上，才转向床头的水杯。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，你醒了。”","time":null,"st":0,"fx":null},{"k":"p","t":"这声称呼让你脑子里那些该问的话一下全乱了。","time":null,"st":0,"fx":null},{"k":"p","t":"他是谁，这是哪，为什么锁你，你的手机是不是他拿的。","time":null,"st":0,"fx":null},{"k":"p","t":"最后挤出来的是：“你是哪个班的？”","time":null,"st":0,"fx":null},{"k":"p","t":"问完你就想咬自己的舌头。","time":null,"st":0,"fx":null},{"k":"p","t":"可他却真的停住了，那双眼睛认真看着你，像是准备回答。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"pick","opts":[{"label":"“把钥匙给我。”","paras":[{"k":"p","t":"你用手掌撑住床头，尽量压稳声音。","time":null,"st":0,"fx":null},{"k":"p","t":"“先把钥匙给我。”","time":null,"st":0,"fx":null},{"k":"p","t":"对面没有动。","time":null,"st":0,"fx":null},{"k":"p","t":"“你听见没有？把链子解开，现在。”","time":null,"st":0,"fx":null},{"k":"p","t":"说到最后，你的声音还是破了。","time":null,"st":0,"fx":null},{"k":"p","t":"那句命令不像命令，倒像你在逼他证明这一切还有商量的余地。","time":null,"st":0,"fx":null},{"k":"p","t":"他抱托盘的手指蜷了一下，越收越紧。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，先喝点水。”","time":null,"st":0,"fx":null},{"k":"p","t":"“我他妈让你拿钥匙。”","time":null,"st":0,"fx":null},{"k":"p","t":"那双眼睛垂下去，你心里竟因此而闪过一丝后悔。","time":null,"st":0,"fx":null},{"k":"p","t":"可下一瞬，你又开始为这丝后悔恼火。","time":null,"st":0,"fx":null},{"k":"p","t":"他把你锁在这里，骂他一句又怎么样。","time":null,"st":0,"fx":null},{"k":"p","t":"你抬起头还想再说，喉咙却紧得发疼。","time":null,"st":0,"fx":null},{"k":"p","t":"对面站在原地，没有走，也没有拿出钥匙。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":2},{"label":"“这是什么地方？”","paras":[{"k":"p","t":"“这是哪？”","time":null,"st":0,"fx":null},{"k":"p","t":"他环视了遍房间，“卧室。”","time":null,"st":0,"fx":null},{"k":"p","t":"“我知道是卧室，我问你这是什么房子，谁的房间，我为什么在这儿？”","time":null,"st":0,"fx":null},{"k":"p","t":"那张嘴张了张，像要从这么多问题里挑一个先答。","time":null,"st":0,"fx":null},{"k":"p","t":"你等不了，身子往前一倾：“你说话。”","time":null,"st":0,"fx":null},{"k":"p","t":"链条被这个动作带得响了一声。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他的目光立刻落到你脚踝上，眉间也随着皱起来。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，别乱动。”","time":null,"st":0,"fx":null},{"k":"p","t":"这五个字让人气得差点笑出来。","time":null,"st":0,"fx":null},{"k":"p","t":"他把你锁在这儿，却叫你别乱动。","time":null,"st":0,"fx":null},{"k":"p","t":"你的笑声真的漏出来了，很短，也很难听。","time":null,"st":0,"fx":null},{"k":"p","t":"对面被那声笑弄得怔住，抱着托盘半天没有接话。","time":null,"st":0,"fx":null},{"k":"p","t":"你别开脸，胸口还在起伏。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":1},{"label":"先不说话","paras":[{"k":"p","t":"话到嘴边，又被你咽了回去。","time":null,"st":0,"fx":null},{"k":"p","t":"不是冷静，只是在看清他手里有什么之前，不敢再骂第二句。","time":null,"st":0,"fx":null},{"k":"p","t":"对面也没有催，只抱着托盘站了一会儿，低头把水杯、毛巾和一盒药依次摆正。","time":null,"st":0,"fx":null},{"k":"p","t":"每样东西都有固定的位置，连杯柄都朝着你。","time":null,"st":0,"fx":null},{"k":"p","t":"你的目光停在那盒药上，药盒立刻被往托盘里推了推。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“现在不用吃。”","time":null,"st":0,"fx":null},{"k":"p","t":"你抬头看向他，那只手才从药盒上收回去，像是这才意识到自己说多了。","time":null,"st":0,"fx":null},{"k":"p","t":"屋里越安静，呼吸声越清楚。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，你不用现在说话。”","time":null,"st":0,"fx":null},{"k":"p","t":"这句话没有让你放松。","time":null,"st":0,"fx":null},{"k":"p","t":"被角被抓得更紧，掌心也重新出了汗。","time":null,"st":0,"fx":null}]}]},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"托盘被放到床头柜上，又往里面推远了一点。","time":null,"st":0,"fx":null},{"k":"p","t":"那个位置正好，正好在你够不到的地方。","time":null,"st":0,"fx":null},{"k":"p","t":"杯柄被转到朝你的方向，水杯随后递到面前：“老师，水还温着。”","time":null,"st":0,"fx":null},{"k":"p","t":"你没有接。","time":null,"st":0,"fx":null},{"k":"p","t":"杯里的水面轻轻晃着，舌根那股苦味也跟着返上来。","time":null,"st":0,"fx":null},{"k":"p","t":"你不知道自己是怎么睡过去的，也不知道他是不是正等着你再把什么东西喝下去。","time":null,"st":0,"fx":null},{"k":"p","t":"那条手臂举了一会儿，竟开始发抖。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“先拿走。”","time":null,"st":0,"fx":null},{"k":"p","t":"杯子仍停在原处。","time":null,"st":0,"fx":null},{"k":"p","t":"“我让你拿走。”","time":null,"st":0,"fx":null},{"k":"p","t":"那只手这才往回缩。","time":null,"st":0,"fx":null},{"k":"p","t":"**杯底磕在托盘上，脆响炸开。**","time":null,"st":0,"fx":null},{"k":"p","t":"水泼上手背，他的手指猛地攥紧杯身。","time":null,"st":0,"fx":null},{"k":"p","t":"“对不起。对不起，对不起。我不是……对不起。”","time":null,"st":0,"fx":null},{"k":"p","t":"“没事。”","time":null,"st":0,"fx":null},{"k":"p","t":"这两个字没过脑子，出口时快得连你自己都没拦住。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他攥杯子的手指开始慢慢松开。","time":null,"st":0,"fx":null},{"k":"p","t":"纸巾被他抽出来，手背和托盘很快被擦干，杯里又重新续上了半杯水。","time":null,"st":0,"fx":null},{"k":"p","t":"看着这些熟练的动作，你却恨不得咬断自己的舌头。","time":null,"st":0,"fx":null},{"k":"p","t":"你被锁在他的床上，他在为洒了水道歉，而你居然还在安慰他。","time":null,"st":0,"fx":null},{"k":"p","t":"“水温刚好，杯子没坏，还能喝，老师不渴也得喝一点，不然待会儿……”","time":null,"st":0,"fx":null},{"k":"p","t":"声音忽然停了。","time":null,"st":0,"fx":null},{"k":"p","t":"“待会儿会怎样？”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"没有回答。","time":null,"st":0,"fx":null},{"k":"p","t":"那只手从托盘边移开，转向你的被角。","time":null,"st":0,"fx":null},{"k":"p","t":"被子刚被提起一点，腿已经立刻被你往里收。","time":null,"st":0,"fx":null},{"k":"p","t":"顾不上疼，你抬手挡在半空：“别碰我。”","time":null,"st":0,"fx":null},{"k":"p","t":"他看到后停了下来，隔着那点距离，你的手臂还在抖，收回去也不是，继续挡着也不是。","time":null,"st":0,"fx":null},{"k":"p","t":"最后，是他先把手放了下来。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"这一声比刚才轻。","time":null,"st":0,"fx":null},{"k":"p","t":"这张虎脸依旧陌生，害怕、怒气和一肚子问题挤在一起。","time":null,"st":0,"fx":null},{"k":"p","t":"你想站起来，想把这条链子扔到他面前，想让他别再用那种语气和你说话。","time":null,"st":0,"fx":null},{"k":"p","t":"可你什么都做不了，只能抓紧身下的床单。","time":null,"st":0,"fx":null},{"k":"p","t":"“你到底是谁？”","time":null,"st":0,"fx":null}],"choices":[],"branches":{},"ending":[]},{"num":"第二章","title":"认","common":[{"k":"p","t":"“你到底是谁？”","time":"03:50","st":0,"fx":null},{"k":"p","t":"问完以后，房间里只剩暖气的轻响。","time":null,"st":0,"fx":null},{"k":"p","t":"他没有回答，湿纸巾还被捏在手里，边角被一点点叠成整齐的方块。","time":null,"st":0,"fx":null},{"k":"p","t":"你等了一会儿，当班主任攒下来的经验又冒了出来，学生不说，老师就别急着替他说，沉默总会让一个人先撑不住。","time":null,"st":0,"fx":null},{"k":"p","t":"可这次先撑不住的是你。","time":null,"st":0,"fx":null},{"k":"p","t":"“你到底认不认识我？”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“认识。”","time":null,"st":0,"fx":null},{"k":"p","t":"纸巾终于被放到一边，他答得很认真。","time":null,"st":0,"fx":null},{"k":"p","t":"你撑住床头，想趁他肯开口，把该说的话一次说完。","time":null,"st":0,"fx":null},{"k":"p","t":"“我还有课，我一夜不回去，学校会找人，家里也会找人，你现在把钥匙给我，事情还能——”","time":null,"st":0,"fx":null},{"k":"p","t":"“贺白。”","time":null,"st":0,"fx":null},{"k":"p","t":"他突然说出自己的名字，把你后面的话截断了。","time":null,"st":0,"fx":null},{"k":"p","t":"你还没反应过来，他已经重新看向你。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，我叫贺白。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"probe","opts":[{"label":"他的脸","paras":[{"k":"p","t":"灯光从他的灰橘色毛发上压下来，照出耳尖的深纹，也照出虎耳内侧一道旧缺口。","time":null,"st":0,"fx":null},{"k":"p","t":"那道缺口让你多看了两眼。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有避，只有耳朵被看得往后压了一点。","time":null,"st":0,"fx":null},{"k":"p","t":"你应该认得它，也可能只是现在太想认出他，才给每处细节都找一个熟悉的位置。","time":null,"st":0,"fx":null},{"k":"p","t":"你的视线落到鼻梁，再落回眼睛，那张脸仍然陌生。","time":null,"st":0,"fx":null},{"k":"p","t":"可贺白看你的眼神，不像在看陌生人。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你把目光移开，停在床头的闹钟上，过了一会儿又看回去。","time":null,"st":0,"fx":null},{"k":"p","t":"二十二岁的脸已经长开了，属于少年的那点轮廓被拉长，只有垂眼时还留着一点旧样子。","time":null,"st":0,"fx":null},{"k":"p","t":"记忆仍旧没有给出答案，反倒让你心里更烦躁。","time":null,"st":0,"fx":null},{"k":"p","t":"“你别这么看我。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白怔了一下，竟真的垂下眼睛。","time":null,"st":0,"fx":null},{"k":"p","t":"房间里安静下来，你却并没有因此而好受一点。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]},{"label":"旧作业本","paras":[{"k":"p","t":"贺白腿边放着一个旧作业本，封面已经磨白。","time":null,"st":0,"fx":null},{"k":"p","t":"你的目光刚落过去，他就把本子拿起来，递到你眼前。","time":null,"st":0,"fx":null},{"k":"p","t":"“您看字。”","time":null,"st":0,"fx":null},{"k":"p","t":"你没有接，只示意他再靠近一点。","time":null,"st":0,"fx":null},{"k":"p","t":"纸页在灯下翻开，上面的字很小，竖画一律写得笔直。","time":null,"st":0,"fx":null},{"k":"p","t":"**最后那个“白”字，仍收得那么紧。**","time":null,"st":0,"fx":null},{"k":"p","t":"像写的人也不打算多占地方。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"记忆先认出了字，随后才认出他。","time":null,"st":0,"fx":null},{"k":"p","t":"“贺白。”这次是你说的，“坐在靠窗那排？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的耳朵立刻抬了起来。","time":null,"st":0,"fx":null},{"k":"p","t":"“对，冬天漏风，您把靠窗的座位都贴过一条胶带，我的那条总翘，您也总会过来多换几遍。”","time":null,"st":0,"fx":null},{"k":"p","t":"他说得很快，说到胶带又跑题，手指开始在本子边上找并不存在的东西。","time":null,"st":0,"fx":null},{"k":"p","t":"你看着那些字，终于把眼前的人和教室里的那个学生接到了一起。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]},{"label":"闹钟","paras":[{"k":"p","t":"床头柜上的绿字轻轻跳了一下，停在03:50。","time":null,"st":0,"fx":null},{"k":"p","t":"你盯着它，试图算出自己在这里待了多久，可什么时候被带来，失去意识前是几点，全都不知道。","time":null,"st":0,"fx":null},{"k":"p","t":"从你醒来到现在，这只钟一直在走。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"办公桌上的手机接着浮进脑子里。","time":null,"st":0,"fx":null},{"k":"p","t":"它可能还在学校，也可能被人拿走，可能已经有电话打进来，也可能一直黑着。","time":null,"st":0,"fx":null},{"k":"p","t":"学校几点会发现你没到，谁会替你看早读，这些问题一个接一个往外冒。","time":null,"st":0,"fx":null},{"k":"p","t":"你明知道现在想这些没用，还是忍不住。","time":null,"st":0,"fx":null},{"k":"p","t":"只要想着学校，你就不用只看这间房。","time":null,"st":0,"fx":null},{"k":"p","t":"直到脚踝上的链条轻轻响了一下，你才重新看向贺白。","time":null,"st":0,"fx":null}]}]},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白。","time":null,"st":0,"fx":null},{"k":"p","t":"第一届学生里，确实有这个人。","time":null,"st":0,"fx":null},{"k":"p","t":"那时你刚当班主任，比现在的他也大不了多少，你怕镇不住学生，连训话都要提前打腹稿。","time":null,"st":0,"fx":null},{"k":"p","t":"谁迟到，谁没交作业，谁最近总趴着，你就在名册边上写小字，免得开口时叫错人。","time":null,"st":0,"fx":null},{"k":"p","t":"可贺白的名字旁边你写过什么？","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"这个空白让你脸上发热。","time":null,"st":0,"fx":null},{"k":"p","t":"明明被锁链拖住的是你，你却先因为自己没记住学生而心虚。","time":null,"st":0,"fx":null},{"k":"p","t":"你被这个反应气笑了，笑到一半又停住，因为贺白还在看。","time":null,"st":0,"fx":null},{"k":"p","t":"他不像在等你评价，也不像准备怪你，只是等着，像已经等了很久。","time":null,"st":0,"fx":null},{"k":"p","t":"你把被角抓在手里。","time":null,"st":0,"fx":null},{"k":"p","t":"“你找我干什么？”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有回答，只把作业本又往你这边送了一点。","time":null,"st":0,"fx":null},{"k":"p","t":"“那次下雨，您把我留在办公室。”","time":null,"st":0,"fx":null},{"k":"p","t":"本子停在灯下，纸页很薄，边角微微发卷。","time":null,"st":0,"fx":null},{"k":"p","t":"你顺着这句话想，没交作业，课后谈话，外面下雨。","time":null,"st":0,"fx":null},{"k":"p","t":"这样的下午太多，雨伞和湿袖子混在一起，分不清是哪一届。","time":null,"st":0,"fx":null},{"k":"p","t":"“我让你补作业？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白低头看着那一页，手指压住纸角，没有马上回答。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"过了片刻他才重新开口：“您先把椅子推给了我。”","time":null,"st":0,"fx":null},{"k":"p","t":"你的眉间还皱着，他却已经顺着那段记忆继续往下说。","time":null,"st":0,"fx":null},{"k":"p","t":"“然后您说，先写这一行，写完再说，您自己的袖口湿了，也没走。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的语气很肯定。","time":null,"st":0,"fx":null},{"k":"p","t":"可你记忆里的那次留下，只因为他没交作业。","time":null,"st":0,"fx":null},{"k":"p","t":"至于雨，椅子，袖口，你一样也想不起来。","time":null,"st":0,"fx":null},{"k":"p","t":"他说的是你的事，你却像个旁听的人。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你记忆里的那次谈话并不温和。","time":null,"st":0,"fx":null},{"k":"p","t":"他连着没交作业，刚带班的你又急又拙，站在办公桌前口一快，话就被说重了。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白低垂着头，你却在问：“你到底还想不想学？”","time":null,"st":0,"fx":null},{"k":"p","t":"现在你当然不会这么问，只有刚毕业那时才会。","time":null,"st":0,"fx":null},{"k":"p","t":"看见学生把头低下去，还以为你终于把话问进了他心里。","time":null,"st":0,"fx":null},{"k":"p","t":"这句话到现在都让你觉得难堪。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白记得的却是另一个下午。","time":null,"st":0,"fx":null},{"k":"p","t":"雨，一半没拉的窗帘，干着的右边袖口，湿掉的左边袖口。","time":null,"st":0,"fx":null},{"k":"p","t":"连书本被你挪过，灯座压住一张通知单，他都说得清楚。","time":null,"st":0,"fx":null},{"k":"p","t":"那些细节被他一件件摆出来，你这边却只剩一句“你到底还想不想学”。","time":null,"st":0,"fx":null},{"k":"p","t":"你几乎要向他道歉。","time":null,"st":0,"fx":null},{"k":"p","t":"舌尖抵到牙齿，你才意识到这件事有多荒唐。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"需要解释的人不是你，至少现在不是。","time":null,"st":0,"fx":null},{"k":"p","t":"“贺白，可能我有些地方记不清了，但你记得我帮过你，对不对？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白点头。","time":null,"st":0,"fx":null},{"k":"p","t":"“那你现在这样做，我没办法跟你好好谈，你先把——”","time":null,"st":0,"fx":null},{"k":"p","t":"你的左脚在这时往床边滑了一下，链条立刻绷紧。","time":null,"st":0,"fx":null},{"k":"p","t":"低头看见自己还被锁着的脚踝，你刚压下去的声音忽然冲了上来。","time":null,"st":0,"fx":null},{"k":"p","t":"“你把我锁在这里，还让我跟你谈？”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手指蜷了起来。","time":null,"st":0,"fx":null},{"k":"p","t":"你看见了，知道自己该停，可也仅仅只是知道。","time":null,"st":0,"fx":null},{"k":"p","t":"“你今年二十二岁，不是十六岁，把钥匙给我，听见没有？”","time":null,"st":0,"fx":null},{"k":"p","t":"你闭上嘴以后，胸口还在剧烈起伏。","time":null,"st":0,"fx":null},{"k":"p","t":"刚才那些话没有一句能解决问题，这一点你很清楚，可清楚并不能把它们收回去。","time":null,"st":0,"fx":null},{"k":"p","t":"作业本仍被贺白抱着，钥匙没有拿出来。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你吸了一口气，再开口时，语气勉强往回收了一些。","time":null,"st":0,"fx":null},{"k":"p","t":"“好，我们先换个地方，你把链子打开，我们出去说。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有立刻回答。","time":null,"st":0,"fx":null},{"k":"p","t":"你以为他还要拒绝，正准备换个说法，他却低声重复：“我们。”","time":null,"st":0,"fx":null},{"k":"p","t":"只接了这两个字。","time":null,"st":0,"fx":null},{"k":"p","t":"你停下来，他又说：“我们换个地方。”","time":null,"st":0,"fx":null},{"k":"p","t":"“是，我们。”你顺着他说得很快，像在哄一个不肯进办公室的学生，“所以你先拿钥匙。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有拿。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“老师还是这样。先让我坐下，再告诉我慢慢来，事情一件一件解决，您以前也是这么说的。”","time":null,"st":0,"fx":null},{"k":"p","t":"“我以前还说过什么？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白又不说话了。","time":null,"st":0,"fx":null},{"k":"p","t":"台灯照着他的侧脸，他的手掌压住作业本，指尖一根根收拢，又一根根放开。","time":null,"st":0,"fx":null},{"k":"p","t":"你等不下去，身子往前挪了一点，链条随之发出轻响。","time":null,"st":0,"fx":null},{"k":"p","t":"“算了，你不想说就——”","time":null,"st":0,"fx":null},{"k":"p","t":"“您说，‘你别急，我等你。’”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的声音插了进来，你剩下的话反而停了。","time":null,"st":0,"fx":null},{"k":"p","t":"这句话你确实说过。","time":null,"st":0,"fx":null},{"k":"p","t":"对考试失利的学生说过，对讲不清事情的学生说过，对站在办公室里哭、又不肯说原因的学生也说过。","time":null,"st":0,"fx":null},{"k":"p","t":"说的时候是真心的，可归根结底，它也只是你工作里很普通的一句话。","time":null,"st":0,"fx":null},{"k":"p","t":"单独对贺白说过的那一次，你想不起来。","time":null,"st":0,"fx":null},{"k":"p","t":"他还看着你，像在等你亲口承认。","time":null,"st":0,"fx":null},{"k":"pick","opts":[{"label":"“我记得你。”","paras":[{"k":"p","t":"“我记得你。”","time":null,"st":0,"fx":null},{"k":"p","t":"你答得很快，不知道是在回答他，还是先交出一件能让他满意的东西。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的耳朵抬起来，手指也慢慢松开。","time":null,"st":0,"fx":null},{"k":"p","t":"你看见了，立刻又补上一句：“我记得你，但我现在要回去，我的学生还在等我。”","time":null,"st":0,"fx":null},{"k":"p","t":"他刚刚松开的肩膀停住了。","time":null,"st":0,"fx":null},{"k":"p","t":"话说出口，你才知道坏了。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你想补救，却不知道该收回哪一句。","time":null,"st":0,"fx":null},{"k":"p","t":"说记得他，是真的。","time":null,"st":0,"fx":null},{"k":"p","t":"说要回去，也是真的。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的目光从你脸上移向门口，又慢慢移回来。","time":null,"st":0,"fx":null},{"k":"p","t":"他没有问你记得多少，也没有问你究竟要回去做什么。","time":null,"st":0,"fx":null},{"k":"p","t":"“您总是有别人。”","time":null,"st":0,"fx":null},{"k":"p","t":"准备好的那些话，全卡在了喉咙里。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]},{"label":"“我不记得。”","paras":[{"k":"p","t":"“我不记得。”","time":null,"st":0,"fx":null},{"k":"p","t":"你的手腕突然被贺白抓住。","time":null,"st":0,"fx":null},{"k":"p","t":"他的力气很大，你往回抽了一下，他反应过来后立刻松开，只是掌心仍悬在那里。","time":null,"st":0,"fx":null},{"k":"p","t":"**腕上留下了一圈红印。**","time":null,"st":0,"fx":null},{"k":"p","t":"“对不起，对不起，我没想……对不起。”","time":null,"st":0,"fx":null},{"k":"p","t":"这次，你没有说没事。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"骂人的话已经到了嘴边，先出来的却是一声很短的喘。","time":null,"st":0,"fx":null},{"k":"p","t":"你把手腕往袖子里收，手指抓了两次，才抓住袖口。","time":null,"st":0,"fx":null},{"k":"p","t":"“贺白，我记得你。”","time":null,"st":0,"fx":null},{"k":"p","t":"这句话说得更快，你分明是在拿它换他安静下来，却不敢看他。","time":null,"st":0,"fx":null},{"k":"p","t":"“但我现在要回去，我的学生还在等我。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手指重新压上作业本。","time":null,"st":0,"fx":null},{"k":"p","t":"“您总是有别人。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":2},{"label":"“先把钥匙给我。”","paras":[{"k":"p","t":"“先把钥匙给我。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有动，你听见自己又在用命令的口气，只能放慢一点，把话说得更完整。","time":null,"st":0,"fx":null},{"k":"p","t":"“我们出去以后再谈，我可以听你说，这句不是骗你。”","time":null,"st":0,"fx":null},{"k":"p","t":"他的手指仍压着作业本的折角。","time":null,"st":0,"fx":null},{"k":"p","t":"你以为他没有听懂，正想再解释，他却在这时开口：“我听见了。”","time":null,"st":0,"fx":null},{"k":"p","t":"“那就把钥匙——”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白低下头，继续压那个折角，没有让你把话说完。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"床头的枕头被你抓起来，手臂都已经抬起，最后却只是把枕头砸回自己腿边。","time":null,"st":0,"fx":null},{"k":"p","t":"“你到底要我怎么样？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的目光落在那个枕头上，声音很轻：“老师，别乱动。”","time":null,"st":0,"fx":null},{"k":"p","t":"你胸口一堵，话脱口而出：“我还有学生，我不能躺在这里陪你说话。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手指停在折角上。","time":null,"st":0,"fx":null},{"k":"p","t":"“您总是有别人。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":1}]},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"讲理，商量，先稳住对方，每一条都还排着队，可没有一条能接上这句话。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白捡起作业本，把压皱的封面抹平，随后起身走向门口。","time":null,"st":0,"fx":null},{"k":"p","t":"你想叫住他，又不想让他再靠近，最后什么都没说。","time":null,"st":0,"fx":null},{"k":"p","t":"他的手指碰到开关，灯灭了。","time":null,"st":0,"fx":null},{"k":"p","t":"黑暗里只剩闹钟的绿光。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"关门前，贺白回过头，又把那句话学了一遍。","time":null,"st":0,"fx":null},{"k":"p","t":"“你别急，我等你。”","time":null,"st":0,"fx":null},{"k":"p","t":"连停顿都和你习惯的口气一样。","time":null,"st":0,"fx":null},{"k":"p","t":"“你讲过的。”","time":null,"st":0,"fx":null},{"k":"p","t":"你想反驳，可却连一句完整的话都找不出来。","time":null,"st":0,"fx":null},{"k":"p","t":"门合上了，连锁舌声都没有。","time":null,"st":0,"fx":null},{"k":"p","t":"**你的脚还是锁着。**","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“贺白。”","time":null,"st":0,"fx":null},{"k":"p","t":"他的名字立刻冲出了你的嘴。","time":null,"st":0,"fx":null},{"k":"p","t":"不是要跟他谈，也不是还有什么道理没讲完。","time":null,"st":0,"fx":null},{"k":"p","t":"只是他走了，这间屋里就连另一个人的呼吸都没有了。","time":null,"st":0,"fx":null},{"k":"p","t":"门外的话音停了一瞬。","time":null,"st":0,"fx":null},{"k":"p","t":"你把被角抓得更紧，没有再喊出第二声。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"那扇看不见的门还立在黑暗里。","time":"04:40","st":0,"fx":null},{"k":"p","t":"学校几点会发现你没到，谁会替你看早读，办公桌上的手机还有没有人管它，这些问题又被你轮流想了一遍。","time":null,"st":0,"fx":null},{"k":"p","t":"没有一个有答案。","time":null,"st":0,"fx":null},{"k":"p","t":"门外，贺白重新说了起来。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师记得名字，名字记得，字也记得，别的慢一点，可以慢一点，他说过的，他会等……”","time":null,"st":0,"fx":null},{"k":"p","t":"声音隔着门，一直没有停。","time":null,"st":0,"fx":null}],"choices":[],"branches":{},"ending":[]},{"num":"第三章","title":"旧账","common":[{"k":"p","t":"台灯重新亮起。","time":"05:10","st":0,"fx":null},{"k":"p","t":"你的眼皮刚动了一下，开关的轻响先一步落进耳朵里。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白坐在床边，膝上仍是那个旧作业本，像刚才的离开只是去门外站了一会儿。","time":null,"st":0,"fx":null},{"k":"p","t":"楼上有人走过，脚步隔着楼板，很轻。","time":null,"st":0,"fx":null},{"k":"p","t":"你也抬头看了一眼。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“快出门了。”","time":null,"st":0,"fx":null},{"k":"p","t":"你不知道贺白是在说楼上的人，还是在说他自己。","time":null,"st":0,"fx":null},{"k":"p","t":"你没有问。","time":null,"st":0,"fx":null},{"k":"p","t":"他等了一会儿，低头翻开作业本，把封面上的名字露出来。","time":null,"st":0,"fx":null},{"k":"p","t":"“贺是我父亲的姓，白是我母亲的姓。”","time":null,"st":0,"fx":null},{"k":"p","t":"他说得很平常，手指却在两个字之间来回移动。","time":null,"st":0,"fx":null},{"k":"p","t":"“他们当时觉得，这样比较好记。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你把视线从那个名字上移开。","time":null,"st":0,"fx":null},{"k":"p","t":"“这跟我有什么关系？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有马上回答。","time":null,"st":0,"fx":null},{"k":"p","t":"他把本子转过来，让你看内页，可你记忆里的那些字并没有因此多出新的意义。","time":null,"st":0,"fx":null},{"k":"p","t":"“您叫我的时候不一样，每次都不一样。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白翻页时，耳后的毛被灯光照出几块参差。","time":null,"st":0,"fx":null},{"k":"p","t":"有短的，有打结的，靠近颈侧的一撮还留着焦过的卷曲。","time":null,"st":0,"fx":null},{"k":"p","t":"你见过更糟的时候。","time":null,"st":0,"fx":null},{"k":"p","t":"高中时，他的袖口总遮得很严，偶尔露出来的前臂也东秃一块、西缺一块。","time":null,"st":0,"fx":null},{"k":"p","t":"你一直以为那是皮肤病，或是他整理毛发时太用力。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你曾把人留在讲台边，问过疼不疼，也问过要不要去医务室。","time":null,"st":0,"fx":null},{"k":"p","t":"他每次都说不用，你便没有当着其他学生追问，只在下课后把他带到校医那里。","time":null,"st":0,"fx":null},{"k":"p","t":"“先让医生看看，别自己瞎弄。”","time":null,"st":0,"fx":null},{"k":"p","t":"这句话你大概说过不止一次。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你并不记得那些毛最后有没有长好。","time":null,"st":0,"fx":null},{"k":"p","t":"记忆里的他总是站在办公桌边，离你半米，袖子盖到手腕，问什么都说没事。","time":null,"st":0,"fx":null},{"k":"p","t":"你也忙，身后还有一屋子学生等着。","time":null,"st":0,"fx":null},{"k":"p","t":"确认他能上课、没有被同学欺负，你便让他回去。","time":null,"st":0,"fx":null},{"k":"p","t":"如今再想，你仍不知道当时他到底需要哪一句。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"probe","opts":[{"label":"作业本","paras":[{"k":"p","t":"本子比刚才离你更近，纸页散着潮旧的气味。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白翻得很慢，每翻一页，都会先压住翘起的边角。","time":null,"st":0,"fx":null},{"k":"p","t":"里面有红笔留下的短线，也有几句很普通的批语。","time":null,"st":0,"fx":null},{"k":"p","t":"“字写稳了。”“这次交得很齐。”“下次别拖到最后。”","time":null,"st":0,"fx":null},{"k":"p","t":"你认得那些话，因为类似的批语你写过太多。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白却伸出手指，停在其中一句旁边。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“这句是写给我的。”","time":null,"st":0,"fx":null},{"k":"p","t":"你没有否认。","time":null,"st":0,"fx":null},{"k":"p","t":"纸页又往后翻了一页，他的手指仍停在原处，像那行字需要单独留在一块空白里。","time":null,"st":0,"fx":null},{"k":"p","t":"你想告诉他，那只是批作业时随手写下的话。","time":null,"st":0,"fx":null},{"k":"p","t":"可这句话到了嘴边，又显得太像故意伤人。","time":null,"st":0,"fx":null},{"k":"p","t":"你最后只说：“我批过很多本。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白点头：“我知道。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]},{"label":"钥匙","paras":[{"k":"p","t":"钥匙挂在贺白腰侧，被外套挡住了一半。","time":null,"st":0,"fx":null},{"k":"p","t":"他翻作业本时，金属偶尔会碰一下椅背。","time":null,"st":0,"fx":null},{"k":"p","t":"你的目光第三次落过去，他便停住了手。","time":null,"st":0,"fx":null},{"k":"p","t":"没有遮掩，也没有取下来，只是把外套往旁边拉了拉。","time":null,"st":0,"fx":null},{"k":"p","t":"那枚钥匙完整露出来，很小，钥匙圈上挂着一条磨旧的布绳。","time":null,"st":0,"fx":null},{"k":"p","t":"**它离你还是太远。**","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“你在看这个。”","time":null,"st":0,"fx":null},{"k":"p","t":"你没有把脸转开。","time":null,"st":0,"fx":null},{"k":"p","t":"“对，把门打开，把这个也解开。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白顺着你的视线看向脚踝，像才想起那条链子。","time":null,"st":0,"fx":null},{"k":"p","t":"“现在不行。”","time":null,"st":0,"fx":null},{"k":"p","t":"他的声音没有抬高，也没有停顿。","time":null,"st":0,"fx":null},{"k":"p","t":"你被他的回答气笑了：“那你让我看什么？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白把外套重新放好，那把钥匙又藏了回去。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]},{"label":"楼上","paras":[{"k":"p","t":"楼上的脚步又响了一次。","time":null,"st":0,"fx":null},{"k":"p","t":"这次你听得清楚，是有人从房间一头走到另一头，椅子腿在地面挪了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"你张了张嘴，贺白也抬起头。","time":null,"st":0,"fx":null},{"k":"p","t":"两个人都看着天花板，谁也没有先出声。","time":null,"st":0,"fx":null},{"k":"p","t":"脚步很快停了，暖气的轻响重新浮回来。","time":null,"st":0,"fx":null},{"k":"p","t":"你把已经到了喉咙口的喊声压了回去。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“这里有人住。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白嗯了一声。","time":null,"st":0,"fx":null},{"k":"p","t":"他的回答太平，你反而不知道下一句该接什么。","time":null,"st":0,"fx":null},{"k":"p","t":"你想问他是不是把你也关在别人家里，想问他楼上住着谁，最后却只问：“他们知道我在吗？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白却只是低下头，重新把作业本合上。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，你该喝水了。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]}]},{"k":"p","t":"你没有喝水。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白也没有再劝，只把杯子放在掌心捂着，像那一点温度还需要他看着。","time":null,"st":0,"fx":null},{"k":"p","t":"“高中的时候，你总是很忙。”","time":null,"st":0,"fx":null},{"k":"p","t":"“早读、课间、放学，总有人找你。”","time":null,"st":0,"fx":null},{"k":"p","t":"你看着他，不知道这些话要通往哪里。","time":null,"st":0,"fx":null},{"k":"p","t":"他也没有看你。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“我有时候也去找你。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白把杯子换到另一只手，继续说：“问题目，交本子，或者只说一句话。”","time":null,"st":0,"fx":null},{"k":"p","t":"这些事你并非全不记得，只是它们混在许多学生的课间里，没有单独留下位置。","time":null,"st":0,"fx":null},{"k":"p","t":"你想说老师本来就该回答学生。","time":null,"st":0,"fx":null},{"k":"p","t":"可贺白的声音很轻，你不想让这句话再撞回来。","time":null,"st":0,"fx":null},{"k":"p","t":"于是你只问：“后来呢？”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“后来就毕业了。”","time":null,"st":0,"fx":null},{"k":"p","t":"他说完这句，停了很久。","time":null,"st":0,"fx":null},{"k":"p","t":"楼上又有水管响了一声，杯子里的水随之晃了晃。","time":null,"st":0,"fx":null},{"k":"p","t":"你等着他继续，贺白却把杯子递过来。","time":null,"st":0,"fx":null},{"k":"p","t":"你还是没有接。","time":null,"st":0,"fx":null},{"k":"p","t":"他便把杯子收回去，像这个动作也已经做过很多次。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"pick","opts":[{"label":"“先放我走，再谈这些。”","paras":[{"k":"p","t":"“你把这些说完也没用。先放我走，我们再慢慢谈。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手指在杯壁上停住。","time":null,"st":0,"fx":null},{"k":"p","t":"他没有拒绝，也没有答应，只是把杯子放回床头柜。","time":null,"st":0,"fx":null},{"k":"p","t":"你看见钥匙随着他的动作碰了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师，你还是没有听明白。”","time":null,"st":0,"fx":null},{"k":"p","t":"这句话说得很轻，随后他便俯身去看你的脚踝。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":1},{"label":"“你父母知道你这样吗？”","paras":[{"k":"p","t":"“你父母知道你这样吗？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手停在半空。","time":null,"st":0,"fx":null},{"k":"p","t":"那只手先缩回去，碰了一下袖口，像要往下拉，随后才意识到自己在做什么。","time":null,"st":0,"fx":null},{"k":"p","t":"你往后躲了一下，左脚却被链条猛地拽住，踝骨撞上床沿。","time":null,"st":0,"fx":null},{"k":"p","t":"疼痛窜上来，你骂了一句。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白立刻收手，椅子却被他的膝盖顶开，椅脚刮过地面。","time":null,"st":0,"fx":null},{"k":"p","t":"他看着你的脚踝，脸色变了一下，随后去拿药箱。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":3},{"label":"“你一直这样记着我？”","paras":[{"k":"p","t":"“你一直这样记着我？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白抬起眼睛。","time":null,"st":0,"fx":null},{"k":"p","t":"你想把腿收回来，链条却在动作里绷紧，脚踝被磨得发热。","time":null,"st":0,"fx":null},{"k":"p","t":"他伸手想扶，你立刻挡开。","time":null,"st":0,"fx":null},{"k":"p","t":"那只手停在半空，没有再靠近。","time":null,"st":0,"fx":null},{"k":"p","t":"“我记得的也不多。”","time":null,"st":0,"fx":null},{"k":"p","t":"可那本作业本仍被贺白抱在怀里。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":2}]},{"k":"p","t":"脚踝最终被他重新检查了一遍。","time":null,"st":0,"fx":null},{"k":"p","t":"你说过不用，他还是把药箱打开，又在你伸手挡住时停住。","time":null,"st":0,"fx":null},{"k":"p","t":"没有谁再提刚才的问题。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白把用过的纸巾折好，放进垃圾袋，动作慢得像在给这段谈话收尾。","time":null,"st":0,"fx":null},{"k":"p","t":"你看着他的侧脸，忽然觉得他并不打算得到一个答案。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白穿上了外套。","time":"06:20","st":0,"fx":null},{"k":"p","t":"钥匙在腰侧碰响，又被他用手掌按住。","time":null,"st":0,"fx":null},{"k":"p","t":"他先检查床脚的锁，再检查你脚踝上的布垫，最后把水杯往你这边挪了一点。","time":null,"st":0,"fx":null},{"k":"p","t":"那个位置仍旧需要你伸手才够得到。","time":null,"st":0,"fx":null},{"k":"p","t":"“我出去一趟。”","time":null,"st":0,"fx":null},{"k":"p","t":"你没有问他去哪。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"门合上了，依旧没有锁舌声。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的脚步在门外停了一下，又折回来。","time":null,"st":0,"fx":null},{"k":"p","t":"他重新蹲到床脚，把刚才检查过的锁扣再看了一遍。","time":null,"st":0,"fx":null},{"k":"p","t":"你有些忍不住：“你到底要检查几次？”","time":null,"st":0,"fx":null},{"k":"p","t":"你眼前这只老虎抬起头，像是真被问住了。","time":null,"st":0,"fx":null},{"k":"p","t":"过了一会儿，他才松手。","time":null,"st":0,"fx":null},{"k":"p","t":"“很快回来。”","time":null,"st":0,"fx":null}],"choices":[],"branches":{},"ending":[]},{"num":"","title":"间章 · 运动会","common":[{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"这段不是你现在能看见的事。","time":null,"st":0,"fx":null},{"k":"p","t":"是后来贺白坐在床边，一点一点补给你的。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"操场上很热，横幅看不出任何有风经过的痕迹。","time":null,"st":0,"fx":null},{"k":"p","t":"你站在班级前面，作为班主任看着完成参赛项目的学生一个个回来。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白排在一千米的队伍里，校服领口敞得很开。","time":null,"st":0,"fx":null},{"k":"p","t":"他没有过来，只是在回班时看了你一眼。","time":null,"st":0,"fx":null},{"k":"p","t":"你小跑过去，递上那瓶属于他的水。","time":null,"st":0,"fx":null},{"k":"p","t":"那是一个老师会给任何参赛学生的水。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"班级合照被他带回了房间。","time":null,"st":0,"fx":null},{"k":"p","t":"照片里，你站在最前面，笑着看向镜头。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白盯着你的笑，第一次没有把这份目光叫作感激。","time":null,"st":0,"fx":null},{"k":"p","t":"拉下拉链时，他停了两次。","time":null,"st":0,"fx":null},{"k":"p","t":"不是犹豫要不要继续，而是不敢承认自己在想什么。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"想象里，你没有站在讲台上。","time":null,"st":0,"fx":null},{"k":"p","t":"没有办公室，没有作业本，也没有任何属于老师的东西。","time":null,"st":0,"fx":null},{"k":"p","t":"你只是一个终于肯回头看他的人。","time":null,"st":0,"fx":null},{"k":"p","t":"他握着自己，从缓慢到急促，呼吸一点点压进枕头里。","time":null,"st":0,"fx":null},{"k":"p","t":"每次快要失控，白天那瓶普通的水就会重新浮上来。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"顶点到来时，贺白咬着自己的手腕。","time":null,"st":0,"fx":null},{"k":" l},{"k":"pick","opts":[{"label":"让他别再装好人","paras":[{"k":"p","t":"你受够了他连赎罪都像在照顾一件易碎品。","time":null,"st":0,"fx":null},{"k":"p","t":"恨意、药味和一整天的恐惧堵在胸口，你想撕开点什么，哪怕最后疼的是自己。","time":null,"st":0,"fx":null},{"k":"p","t":"“别装好人了。”你抓住他的领口，“我让你碰我，但我说停，你就必须停。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有立刻动。","time":null,"st":0,"fx":null},{"k":"p","t":"他看着你，呼吸一点点变重，像在确认这不是另一句为了逃走的话。","time":null,"st":0,"fx":null},{"k":"p","t":"“这次不是为了钥匙。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你抬手扇了贺白一巴掌。","time":null,"st":0,"fx":null},{"k":"p","t":"清脆的一声过后，你的掌心先麻了，贺白的脸也偏向旁边。","time":null,"st":0,"fx":null},{"k":"p","t":"他转回来时，嘴角被尖牙顶出一点血，眼神终于不再温和。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师还想怎么继续？”","time":null,"st":0,"fx":null},{"k":"p","t":"你没回答，揪着他的领口把人拉近。","time":null,"st":0,"fx":null},{"k":"p","t":"下一秒，他扣住你的后颈，重重咬了下来。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"这一口落在唇上，又很快移到颈侧。","time":null,"st":0,"fx":null},{"k":"p","t":"尖牙抵着皮肤，疼痛让你倒吸一口气，手指却插进他耳后的短毛里，用力拽住。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白低吼了一声，扣着后颈的手更紧。","time":null,"st":0,"fx":null},{"k":"p","t":"你用指甲挠过他下颌，留下几道很快发红的路。","time":null,"st":0,"fx":null},{"k":"p","t":"谁都没有再说对不起。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"衬衫被你们扯开，纽扣落在床下，弹了两次才停。","time":null,"st":0,"fx":null},{"k":"p","t":"灰橘色的毛从领口一路露到腰腹，几块长短不一的地方间杂着浅色旧疤。","time":null,"st":0,"fx":null},{"k":"p","t":"你的手在那里停了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白立刻攥住你的手腕，力气大得发疼。","time":null,"st":0,"fx":null},{"k":"p","t":"“别问。”","time":null,"st":0,"fx":null},{"k":"p","t":"你便没问，只当着他紧绷的目光，把手掌重新贴了回去。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他盯着你看了几秒，忽然把你的手按到枕边。","time":null,"st":0,"fx":null},{"k":"p","t":"身体随之覆下来，毛尖扫过裸露的皮肤，痒意和热意一起往里钻。","time":null,"st":0,"fx":null},{"k":"p","t":"你挣了一下，没有挣开，链条在左脚边撞出急促的响。","time":null,"st":0,"fx":null},{"k":"p","t":"那声音让你本能地慌了。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有哄，只是用牙齿咬住你胸前的衣料，狠狠扯开。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你弓起腿顶住他，原本想推，却被他用尾巴缠住了右腿。","time":null,"st":0,"fx":null},{"k":"p","t":"粗长的尾巴收紧一圈，把你的腿拖回原处，床面也跟着沉下去。","time":null,"st":0,"fx":null},{"k":"p","t":"“贺白。”","time":null,"st":0,"fx":null},{"k":"p","t":"他抬眼，尖牙上还挂着一点撕下来的线头。","time":null,"st":0,"fx":null},{"k":"p","t":"你骂了句脏话，手掌却沿他的背一路抓下去。","time":null,"st":0,"fx":null},{"k":"p","t":"那条尾巴反而缠得更牢。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他的手掌隔着衣物碾过你腿间，动作没有半点方才换药时的耐心。","time":null,"st":0,"fx":null},{"k":"p","t":"你毫无准备，腰猛地抬起来，喉间漏出一声短促的喘。","time":null,"st":0,"fx":null},{"k":"p","t":"羞耻紧跟着涌上来，你咬住嘴，却听见他在耳边低笑。","time":null,"st":0,"fx":null},{"k":"p","t":"“现在知道躲了？”","time":null,"st":0,"fx":null},{"k":"p","t":"你抬膝撞他，被他一把按住右腿。","time":null,"st":0,"fx":null},{"k":"p","t":"“别得意。”你喘着粗气，话却没停，“继续。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"布料被推到一边，他的手指直接碰上来，热度窜得比脑子更快。","time":null,"st":0,"fx":null},{"k":"p","t":"你抓紧他的肩，指尖隔着短毛掐进皮肤，留下的红痕一道叠着一道。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白连眉头都没皱，只盯着你的脸，把你每一次想藏起来的反应都逼出来。","time":null,"st":0,"fx":null},{"k":"p","t":"你偏过头，他就咬你耳垂。","time":null,"st":0,"fx":null},{"k":"p","t":"你转回来，他又把吻咬在你唇角。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你也不甘心地把手伸进他凌乱的衣服里。","time":null,"st":0,"fx":null},{"k":"p","t":"掌心向下，碰到他紧绷的小腹，再往下时，贺白的呼吸终于断了一拍。","time":null,"st":0,"fx":null},{"k":"p","t":"你抓住他的弱点，恶意地收紧手指。","time":null,"st":0,"fx":null},{"k":"p","t":"他的尾巴骤然绷直，耳尖也向后压去。","time":null,"st":0,"fx":null},{"k":"p","t":"“你也会这样？”","time":null,"st":0,"fx":null},{"k":"p","t":"回答你的是落在锁骨上的一口，疼得你眼前发白。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"拇指在他腿间恶意一转，腰上的手立刻收紧。","time":null,"st":0,"fx":null},{"k":"p","t":"半寸拖行使床垫发出闷响，尖牙在肩窝磨出灼痛。","time":null,"st":0,"fx":null},{"k":"p","t":"头发被向后扯开，喉结旁随即多了一排新牙印。","time":null,"st":0,"fx":null},{"k":"p","t":"这一刻，你终于不是只能被他摆布的人。","time":null,"st":0,"fx":null},{"k":"p","t":"可床单下的链条仍贴着你的脚踝，凉得清楚。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"尾根被你用掌心揉过时，整条尾巴猛地一颤，右腿上的束缚也随之松了。","time":null,"st":0,"fx":null},{"k":"p","t":"你故意又揉了一把，灼热呼吸立刻压回颈侧。","time":null,"st":0,"fx":null},{"k":"p","t":"再向下的一捋让贺白膝盖撞上床垫，腰后的手几乎把你勒疼。","time":null,"st":0,"fx":null},{"k":"p","t":"笑声刚出口，就被他手上的动作截断。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"疼痛和欲望挤在一起，很快超过了你能分辨的界限。","time":null,"st":0,"fx":null},{"k":"p","t":"你一会儿想把他推开，一会儿又害怕他真的照做。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的动作越来越重，手腕上的新伤被牵动，你终于喊：“停一下。”","time":null,"st":0,"fx":null},{"k":"p","t":"他停得很快，手却仍撑在你身侧，胸膛剧烈起伏。","time":null,"st":0,"fx":null},{"k":"p","t":"你没有道谢，只缓过那阵疼，又抓着他的腰把人拉回来。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"这次他没有再问。","time":null,"st":0,"fx":null},{"k":"p","t":"手掌重新占据你的腿间，拇指恶劣地掠过最敏感的地方，你刚缓下去的呼吸立刻散了。","time":null,"st":0,"fx":null},{"k":"p","t":"你用右臂抱住他的脖子，把呻吟全咬在他肩上。","time":null,"st":0,"fx":null},{"k":"p","t":"左脚的镣铐被垫布护着，链条却不断撞响，像有人在旁边一遍遍提醒你在哪里。","time":null,"st":0,"fx":null},{"k":"p","t":"你恨这声音，身体却在他手里绷紧到了极点。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"释放时，你眼前白了一瞬，手指仍死死抓着他的毛。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有给你躲开的时间，直到最后一点颤抖也被他的掌心榨出来。","time":null,"st":0,"fx":null},{"k":"p","t":"你喘得胸口发疼，仍抬手按住他的腿间，用同样的方式报复回去。","time":null,"st":0,"fx":null},{"k":"p","t":"他俯身撑在你上方，低吼压在喉咙里，最后一口几乎咬穿你的肩衣。","time":null,"st":0,"fx":null},{"k":"p","t":"灰橘色的毛扫过你的脸，湿热而凌乱。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"后来两个人都停下来，屋里只剩杂乱的呼吸。","time":null,"st":0,"fx":null},{"k":"p","t":"你的唇破了，颈侧和锁骨都有牙印，贺白背上的抓痕也没比你好到哪里去。","time":null,"st":0,"fx":null},{"k":"p","t":"他伸手想擦你额角的汗，被你一巴掌拍开。","time":null,"st":0,"fx":null},{"k":"p","t":"那只手停在半空，随后若无其事地收回去。","time":null,"st":0,"fx":null},{"k":"p","t":"你扯过被子盖住身体，心里没有半分温存，只剩痛快。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":3},{"label":"到此为止","paras":[{"k":"p","t":"你看着他的眼睛，忽然不想再应付任何人。","time":null,"st":0,"fx":null},{"k":"p","t":"“今晚别碰我。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有问为什么，收回撑在床边的手，退到椅子那里。","time":null,"st":0,"fx":null},{"k":"p","t":"他把水往你这边挪了一点，又想起你够不到，只好停住。","time":null,"st":0,"fx":null},{"k":"p","t":"“我在门口。你叫我，我再过来。”","time":null,"st":0,"fx":null},{"k":"p","t":"你背过身，真的没再听见他靠近。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]}]},{"k":"p","t":"作业本最后才被捡起来。","time":null,"st":0,"fx":null},{"k":"p","t":"折坏的封面被他一点点抹平，压了很久，痕迹仍在。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白坐在床边，没有开大灯，也没有再把钥匙放回你看得见的位置。","time":null,"st":0,"fx":null},{"k":"p","t":"你闭上眼，听见他在旁边呼吸。","time":null,"st":0,"fx":null},{"k":"p","t":"这一次，他没有道歉。","time":null,"st":0,"fx":null}],"choices":[],"branches":{},"ending":[]},{"num":"第七章","title":"崩塌","common":[{"k":"p","t":"台灯没有关。","time":"00:40","st":0,"fx":null},{"k":"p","t":"你躺在床上，脚踝被垫高，疼痛让每一次翻身都停在半路。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白坐在床边，作业本放在膝上，已经很久没有人说话。","time":null,"st":0,"fx":null},{"k":"p","t":"后来他开始开口，声音很低，像在接着某个只有他知道的段落。","time":null,"st":0,"fx":null},{"k":"p","t":"“大学其实不远。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你没有问什么不远。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白自己继续：“就在你的城市，坐车也不用很久。”","time":null,"st":0,"fx":null},{"k":"p","t":"他看着你，像在等你想起某件事。","time":null,"st":0,"fx":null},{"k":"p","t":"你没有给他任何回应。","time":null,"st":0,"fx":null},{"k":"p","t":"他便把目光落回作业本上。","time":null,"st":0,"fx":null},{"k":"p","t":"“我搬过来以后，离你住的地方更近。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“近到什么程度？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有回答距离，“下楼以后，走一会儿，就能看见你经过的那条路。”","time":null,"st":0,"fx":null},{"k":"p","t":"你的手指在被面上收紧。","time":null,"st":0,"fx":null},{"k":"p","t":"那条路你走过很多次，买早饭，赶公交，晚上加班回来也会走。","time":null,"st":0,"fx":null},{"k":"p","t":"你从来没有注意过路边有没有他。","time":null,"st":0,"fx":null},{"k":"p","t":"可贺白知道。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“你跟踪我？”","time":null,"st":0,"fx":null},{"k":"p","t":"“只是看见。”他没有承认这个词。","time":null,"st":0,"fx":null},{"k":"p","t":"“你早上走得很快，晚上会慢下来，下雨的时候不走树下。”","time":null,"st":0,"fx":null},{"k":"p","t":"这些细节让房间里的空气停了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"你想找出一句反驳，却连他哪里说错都不知道。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"pick","opts":[{"label":"“你每天都在看我？”","paras":[{"k":"p","t":"“你每天都在看我？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白摇头，像是终于有机会纠正你。","time":null,"st":0,"fx":null},{"k":"p","t":"“不是每天，有时候有课，有时候你不出门。”","time":null,"st":0,"fx":null},{"k":"p","t":"他说得太认真，你反而笑不出来。","time":null,"st":0,"fx":null},{"k":"p","t":"“这有什么区别？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白看着你，像是真有区别，却不知道怎么解释。","time":null,"st":0,"fx":null},{"k":"p","t":"最后他只说：“我那时还没有打扰你。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":2},{"label":"“你到底想要什么？”","paras":[{"k":"p","t":"“你到底想要什么？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手指压在作业本上，很久没有动。","time":null,"st":0,"fx":null},{"k":"p","t":"你看着他，疼痛让这个问题也没有说得很完整。","time":null,"st":0,"fx":null},{"k":"p","t":"他最后回答：“你已经问过我了。”","time":null,"st":0,"fx":null},{"k":"p","t":"“什么时候？”","time":null,"st":0,"fx":null},{"k":"p","t":"“以前。”","time":null,"st":0,"fx":null},{"k":"p","t":"他又不说了，只留下你一个人想那句所谓的以前。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":1},{"label":"“别再说了。”","paras":[{"k":"p","t":"“别再说了。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白立刻停住。","time":null,"st":0,"fx":null},{"k":"p","t":"房间里只剩你的呼吸和暖气的水声。","time":null,"st":0,"fx":null},{"k":"p","t":"他把作业本合上，像真的会把这些话收回去。","time":null,"st":0,"fx":null},{"k":"p","t":"可过了一会儿，他又低声补了一句：“我只是想让你知道。”","time":null,"st":0,"fx":null},{"k":"p","t":"你闭上眼，没有问他为什么。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]}]},{"k":"p","t":"“三个月前，我看见你和人吃饭。”","time":null,"st":0,"fx":null},{"k":"p","t":"“你笑了一下。那个人替你拉开椅子。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白说的认真，可你对这件事毫无印象。","time":null,"st":0,"fx":null},{"k":"p","t":"“你走路回家，还回头说了再见。”","time":null,"st":0,"fx":null},{"k":"p","t":"他看着你，像在把那一段路重新走一遍。","time":null,"st":0,"fx":null},{"k":"p","t":"“我想了三个月。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白仍在说。","time":null,"st":0,"fx":null},{"k":"p","t":"有些话前后对不上，有些细节又被他重复得太准确。","time":null,"st":0,"fx":null},{"k":"p","t":"你听见你的学校、住处、下班时间，也听见他如何把这些拼成一条可以遇见你的路。","time":null,"st":0,"fx":null},{"k":"p","t":"他没有说那是跟踪。","time":null,"st":0,"fx":null},{"k":"p","t":"他只是把它叫作“路过”。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“你知不知道这很恶心？”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白停住了。","time":null,"st":0,"fx":null},{"k":"p","t":"台灯下，他的手指一点点收紧，作业本的封面被压出声音。","time":null,"st":0,"fx":null},{"k":"p","t":"你以为他会生气，可他只是把本子放远了一点。","time":null,"st":0,"fx":null},{"k":"p","t":"“知道。”","time":null,"st":0,"fx":null},{"k":"p","t":"这个回答让你更不知道该怎么接。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你差一点顺着问“那你希望我怎么理解你”。","time":null,"st":0,"fx":null},{"k":"p","t":"这句话一冒头，你就认出了它的出处——办公室里，对那些不肯说明情况的学生，你总会这么问。","time":null,"st":0,"fx":null},{"k":"p","t":"你立刻把后半句咬断。","time":null,"st":0,"fx":null},{"k":"p","t":"这里不是办公室，他也不是你等着慢慢谈的学生。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他起身给你倒水。","time":null,"st":0,"fx":null},{"k":"p","t":"你没有喝，他便把杯子放回床头柜。","time":null,"st":0,"fx":null},{"k":"p","t":"钥匙没有再露出来，药箱也被收好，所有东西都比刚才更整齐。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白做完这些，重新坐回床边。","time":null,"st":0,"fx":null},{"k":"p","t":"“你以前不会这样看我。”","time":null,"st":0,"fx":null},{"k":"p","t":"“你以前也没有把我锁起来。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白忽然把袖口卷了上去。","time":null,"st":0,"fx":null},{"k":"p","t":"灰橘色的毛在灯下并不平整，几道旧疤从短毛里穿过去，颜色比周围浅。","time":null,"st":0,"fx":null},{"k":"p","t":"“他们不喜欢这个颜色。”","time":null,"st":0,"fx":null},{"k":"p","t":"你反应了一下，才明白他说的是父母。","time":null,"st":0,"fx":null},{"k":"p","t":"“说灰不灰，橘不橘，看着就脏。”","time":null,"st":0,"fx":null},{"k":"p","t":"他说得很平，手指却用力抹过那几道疤。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他试过把毛剪齐，剪坏了就剪得更短。","time":null,"st":0,"fx":null},{"k":"p","t":"后来也用火烧，以为只要重新长一遍，也许能变成别的颜色。","time":null,"st":0,"fx":null},{"k":"p","t":"“最后连皮都割开过。”","time":null,"st":0,"fx":null},{"k":"p","t":"他说到这里停了一下，像那只是一次没考好的试。","time":null,"st":0,"fx":null},{"k":"p","t":"“还是会长回来。”","time":null,"st":0,"fx":null},{"k":"p","t":"你胃里猛地一缩，先前被他碰到的地方忽然发冷。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你想起医务室门口，想起他总是拉下来的袖子，也想起自己那句“别自己瞎弄”。","time":null,"st":0,"fx":null},{"k":"p","t":"原来他真的一直在自己弄，只是你从没问过为什么。","time":null,"st":0,"fx":null},{"k":"p","t":"“你当时可以告诉我。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白抬眼：“告诉你什么？说我爸妈不喜欢我，还是说我也不喜欢我自己？”","time":null,"st":0,"fx":null},{"k":"p","t":"你被问得说不出话。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“你那时总叫我去医务室。”","time":null,"st":0,"fx":null},{"k":"p","t":"“我以为你病了。”","time":null,"st":0,"fx":null},{"k":"p","t":"“我知道。”","time":null,"st":0,"fx":null},{"k":"p","t":"你忽然想道歉，又觉得这三个字在这里显得恶心。","time":null,"st":0,"fx":null},{"k":"p","t":"他的过去不是今天这条链子的理由，你也没有因为没看出来就欠他一辈子。","time":null,"st":0,"fx":null},{"k":"p","t":"可你的喉咙还是堵了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"灯光被调暗了一点。","time":"02:00","st":0,"fx":null},{"k":"p","t":"贺白没有走，也没有再问你会不会离开。","time":null,"st":0,"fx":null},{"k":"p","t":"他只是坐在床边，偶尔伸手确认你有没有发烧。","time":null,"st":0,"fx":null},{"k":"p","t":"你躲开第一次，第二次却没有力气。","time":null,"st":0,"fx":null},{"k":"p","t":"他的掌心停在额头上，很凉。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"pick","opts":[{"label":"让他把控制权交出来","paras":[{"k":"p","t":"你看着他卷起的袖口，忽然不想再听那些能把人拖软的往事。","time":null,"st":0,"fx":null},{"k":"p","t":"他的痛苦是真的，你身上的锁也是真的。","time":null,"st":0,"fx":null},{"k":"p","t":"你伸手抓住贺白的领口，把人拉到床前。","time":null,"st":0,"fx":null},{"k":"p","t":"“今晚听我的。我说停就停，我说不碰哪里，你就不碰。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白看了你很久，随后单膝跪到床边。","time":null,"st":0,"fx":null},{"k":"p","t":"“好。”","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你命令他把衣服脱了。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白没有迟疑，纽扣一颗颗解开，旧疤和参差的毛全部露在灯下。","time":null,"st":0,"fx":null},{"k":"p","t":"他下意识想挡，你拍开他的手。","time":null,"st":0,"fx":null},{"k":"p","t":"“谁让你躲了？”","time":null,"st":0,"fx":null},{"k":"p","t":"这句话不是安慰，也不是接纳，只是你现在讨厌他连自己的身体都要撒谎。","time":null,"st":0,"fx":null},{"k":"p","t":"你抓住他颈后的毛，逼他抬起脸。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你用指腹压过一道旧疤，没有放轻。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的肩膀抽了一下，仍跪在原地。","time":null,"st":0,"fx":null},{"k":"p","t":"“疼吗？”","time":null,"st":0,"fx":null},{"k":"p","t":"“疼。”","time":null,"st":0,"fx":null},{"k":"p","t":"“那就记住，”","time":null,"st":0,"fx":null},{"k":"p","t":"他瞳孔微微缩起，你随即咬住他的耳朵边缘，听见一声压不住的喘。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"虎耳比你想象中敏感，牙齿刚磨过缺口，他的手指便扣紧了床沿。","time":null,"st":0,"fx":null},{"k":"p","t":"你故意又咬了一次，舌尖随后舔过刚才留下的牙印。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白抬起头，眼里的温顺被一点点磨掉。","time":null,"st":0,"fx":null},{"k":"p","t":"你没有躲，反而用没有受伤的右脚在他腿上踩了一下。","time":null,"st":0,"fx":null},{"k":"p","t":"“急什么？”","time":null,"st":0,"fx":null},{"k":"p","t":"他的尾巴在地上重重扫过。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他忽然起身，把你压在床头，动作带得链条一响。","time":null,"st":0,"fx":null},{"k":"p","t":"你下意识攥住床单，他没有继续，直到你抬眼瞪回去。","time":null,"st":0,"fx":null},{"k":"p","t":"“我没让你停。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白俯身咬住你刚才碰过的手指，尖牙在指节上留下清楚的印子。","time":null,"st":0,"fx":null},{"k":"p","t":"疼痛让你抽气，他却含着你的指尖，用舌尖缓慢地卷过。","time":null,"st":0,"fx":null},{"k":"p","t":"你的小腹随之缩紧。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"他的牙沿着手臂一路往下，隔着衣服咬住你的腰线。","time":null,"st":0,"fx":null},{"k":"p","t":"布料被扯到腿间时，你本能地并拢双腿，却被他撑住右膝。","time":null,"st":0,"fx":null},{"k":"p","t":"“看着。”","time":null,"st":0,"fx":null},{"k":"p","t":"你刚要骂他，湿热便隔着残存的衣料压了上来。","time":null,"st":0,"fx":null},{"k":"p","t":"舌尖和牙齿交替碾过，你的背猛地弓起，手里的被角几乎被撕破。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"推到他发间的指尖被扣住，按回枕边。","time":null,"st":0,"fx":null},{"k":"p","t":"右腿被分得更开，链条在床脚撞出急促的响。","time":null,"st":0,"fx":null},{"k":"p","t":"每次故意挣开，都会被拖回来。","time":null,"st":0,"fx":null},{"k":"p","t":"骂声断得断断续续，最后连尾音也被撞碎。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白抬头时，唇边沾着水光。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"下巴被手指扣住，唇上的湿意随即抹上指背。","time":null,"st":0,"fx":null},{"k":"p","t":"“恶心。”","time":null,"st":0,"fx":null},{"k":"p","t":"“嗯。”","time":null,"st":0,"fx":null},{"k":"p","t":"他认了，还低头舔过指缝。","time":null,"st":0,"fx":null},{"k":"p","t":"颈侧随即挨了一下，力道不轻，呼吸反而更沉。","time":null,"st":0,"fx":null},{"k":"p","t":"掌心下一瞬被尖牙咬住，另一只手直接探进腿间。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"残存的布料最终被扯到一旁，贺白重新低下头。","time":null,"st":0,"fx":null},{"k":"p","t":"没有了那层阻隔，舌尖第一次直接碰上来时，你的右腿在他肩上猛地绷紧。","time":null,"st":0,"fx":null},{"k":"p","t":"他用手背压住你的膝弯，牙齿偶尔擦过，逼你把本来忍住的声音全交出来。","time":null,"st":0,"fx":null},{"k":"p","t":"你抓乱他头顶的毛，连自己是在推还是在按都分不清。","time":null,"st":0,"fx":null},{"k":"p","t":"他却不许你躲，直到你脚尖在他背上蜷得发疼。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"边缘近在眼前，贺白却忽然停了。","time":null,"st":0,"fx":null},{"k":"p","t":"眼睛刚瞪过去，拇指便慢慢擦过方才舌尖停留的地方。","time":null,"st":0,"fx":null},{"k":"p","t":"“刚才谁让我别急？”","time":null,"st":0,"fx":null},{"k":"p","t":"右脚跟踹上他的肩，随即被握住。","time":null,"st":0,"fx":null},{"k":"p","t":"脚背被亲了一下，动作一点也不温柔，尖牙紧接着陷进脚踝内侧。","time":null,"st":0,"fx":null},{"k":"p","t":"这次没有旧伤，只有一排新牙印。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你忽然用右腿勾住他的腰，把贺白掀回床侧。","time":null,"st":0,"fx":null},{"k":"p","t":"肩膀撞上床垫，灰橘色的尾巴从床沿垂下去。","time":null,"st":0,"fx":null},{"k":"p","t":"你跨坐上去，脚踝疼得发麻，仍抓着他的头发让他别动。","time":null,"st":0,"fx":null},{"k":"p","t":"“刚才不是很能耐吗？”","time":null,"st":0,"fx":null},{"k":"p","t":"喉结滚了一下，指甲随即从他胸前慢慢刮下去。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你掌握上下的节奏，故意在他最紧绷的时候停手。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手臂抬了几次，都被你瞪回去，最后只能死死抓住床单。","time":null,"st":0,"fx":null},{"k":"p","t":"你俯身咬他的喉结，舌尖抵着那处滚动，听他的低吼一点点变调。","time":null,"st":0,"fx":null},{"k":"p","t":"他喊了你一声老师。","time":null,"st":0,"fx":null},{"k":"p","t":"“现在别叫。”","time":null,"st":0,"fx":null},{"k":"p","t":"你用手堵住他的嘴，却被他舔过掌心。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"后来再没有人分得清是谁在命令谁。","time":null,"st":0,"fx":null},{"k":"p","t":"你们抓着、咬着，用所有不会真正伤到旧处的方式把对方逼到失控。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白的手掌重新覆上你的腿间，你也同时收紧手指。","time":null,"st":0,"fx":null},{"k":"p","t":"两个人几乎一起到达，呼吸撞在彼此颈侧，床脚的链条响得没有间歇。","time":null,"st":0,"fx":null},{"k":"p","t":"你把脸埋进他的毛里，终于没再压住声音。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"结束时，贺白仍撑着手臂，没有立刻碰你。","time":null,"st":0,"fx":null},{"k":"p","t":"你看到他胸前和颈侧都是自己留下的痕迹，心里闪过一阵近乎报复的满足。","time":null,"st":0,"fx":null},{"k":"p","t":"紧接着，那些旧疤又从乱毛里露出来。","time":null,"st":0,"fx":null},{"k":"p","t":"你用被角盖住他，也盖住自己，动作粗暴得像在收拾一片狼藉。","time":null,"st":0,"fx":null},{"k":"p","t":"他没有说谢谢，你也没有道歉。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"水杯后来被递到你手里。","time":null,"st":0,"fx":null},{"k":"p","t":"你的手指还在发麻，杯子沿唇边碰出一声轻响。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白想替你托住，你抬眼看他，他便松了手。","time":null,"st":0,"fx":null},{"k":"p","t":"水已经凉了，你一口喝得太急，呛得偏过脸咳嗽。","time":null,"st":0,"fx":null},{"k":"p","t":"他站在床边，没有趁机拍你的背。","time":null,"st":0,"fx":null},{"k":"p","t":"你缓过来，仍然恨他，也仍然需要这口水。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}],"effect":3},{"label":"让他停下","paras":[{"k":"p","t":"你拿开额头上的手，往后缩了一点。","time":null,"st":0,"fx":null},{"k":"p","t":"“别再碰我。”","time":null,"st":0,"fx":null},{"k":"p","t":"贺白立刻收回手，连被角都没有再碰。","time":null,"st":0,"fx":null},{"k":"p","t":"他捡起作业本，坐回床边的椅子，离你远了一臂。","time":null,"st":0,"fx":null},{"k":"p","t":"“我不碰。需要水就叫我。”","time":null,"st":0,"fx":null},{"k":"p","t":"你背过身，之后真的没再感觉到他的手。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null}]}]},{"k":"p","t":"后来你昏昏沉沉地闭上眼。","time":null,"st":0,"fx":null},{"k":"p","t":"床边一直没有空下来。","time":null,"st":0,"fx":null},{"k":"p","t":"台灯下偶尔传来衣料摩擦的轻响，更多时候，贺白只是坐在那里。","time":null,"st":0,"fx":null},{"k":"p","t":"你不想知道他究竟有没有睡。","time":null,"st":0,"fx":null},{"k":"p","t":"闹钟的绿光仍在床头柜上。","time":null,"st":0,"fx":null},{"k":"p","t":"它继续走。","time":null,"st":0,"fx":null}],"choices":[],"branches":{},"ending":[]},{"num":"第八章","title":"终章","common":[{"k":"p","t":"黑暗里，你先听见自己的呼吸。","time":"05:30","st":0,"fx":null},{"k":"p","t":"床边的人没有说话，台灯也没有亮，只有闹钟还发着绿光。","time":null,"st":0,"fx":null},{"k":"p","t":"左脚的感觉变得很远，疼痛却没有消失。","time":null,"st":0,"fx":null},{"k":"p","t":"你动了一下，链条随即贴着床脚响了。","time":null,"st":0,"fx":null},{"k":"p","t":"贺白在黑暗里立刻有了动静。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"branch","opts":[{"label":"重伤：墙","paras":[{"k":"p","t":"他没有马上开灯。","time":null,"st":0,"fx":null},{"k":"p","t":"你听见他靠近，听见药箱被碰到，又听见一声很轻的钥匙响。","time":null,"st":0,"fx":null},{"k":"p","t":"“老师？”","time":null,"st":0,"fx":null},{"k":"p","t":"你没有回答。","time":null,"st":0,"fx":null},{"k":"p","t":"床边停了片刻，随后灯亮了。","time":null,"st":0,"fx":null},{"k":"p","t":"你的腿已经肿起来，额头也烫得不对。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"贺白看了你的脚踝很久。","time":"06:10","st":0,"fx":null},{"k":"p","t":"他把药箱打开，又合上，最后才从口袋里拿出钥匙。","time":null,"st":0,"fx":null},{"k":"p","t":"钥匙插进锁孔时，你甚至没有反应过来。","time":null,"st":0,"fx":null},{"k":"p","t":"金属转动，锁扣松开，那条链子第一次落到床脚旁边。","time":null,"st":0,"fx":null},{"k":"p","t":"你的脚自由了。","time":null,"st":0,"fx":null},{"k":"p","t":"可你撑了两次，都没能站起来。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"“我去买药。”贺白说。","time":"06:20","st":0,"fx":null},{"k":"p","t":"他把水杯放到你伸手能碰到的地方，又看着你。","time":null,"st":0,"fx":null},{"k":"p","t":"“你别动。”","time":null,"st":0,"fx":null},{"k":"p","t":"门合上了，依然没有锁舌声。","time":null,"st":0,"fx":null},{"k":"p","t":"他的脚步很快离开楼道。","time":null,"st":0,"fx":null},{"k":"p","t":"房间里只剩你和那条松开的链子。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"你从床上下来时，左脚根本不能受力。","time":"06:30","st":0,"fx":null},{"k":"p","t":"膝盖先落地，随后是手掌。","time":null,"st":0,"fx":null},{"k":"p","t":"你拖着那条腿往厚布那边爬，地板上的凉意贴着手掌，一点点往后退。","time":null,"st":0,"fx":null},{"k":"p","t":"距离不远，你却停了很多次。","time":null,"st":0,"fx":null},{"k":"p","t":"最后，指尖终于碰到垂下来的布料。","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"窗帘环在杆上滑出一串响。","time":"06:40","st":0,"fx":null},{"k":"p","t":"厚布被你拉开。","time":null,"st":0,"fx":null},{"k":"p","t":"后面没有玻璃，没有外面的光，只有钉死的木板。","time":null,"st":0,"fx":null},{"k":"p","t":"木板缝里塞着隔音棉，钉子头全被敲进木头里。","time":null,"st":0,"fx":null},{"k":"p","t":"你伸手摸了一遍，又摸了一遍。","time":null,"st":0,"fx":null},{"k":"p","t":"**那面墙从一开始就是墙。**","time":null,"st":0,"fx":null},{"k":"p","t":"\u0001","time":null,"st":0,"fx":null},{"k":"p","t":"木板后面隐约传来楼下的声音。","time":"07:00","st":0,"fx":null},{"k":"p","t":"书包带碰到车铃，有人在喊名字，还有学生从附近经过。","time":null,"st":0,"fx":null},{"k":"p","t":"那些声音都
