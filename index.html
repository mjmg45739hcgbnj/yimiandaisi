    els.choices.innerHTML = '';
    if (!step) return finish();

    if (step.type === 'branch') {
      typing = false; skip = false;
      playBranch(step);
      return;
    }
    if (step.type === 'probe' || step.type === 'pick') {
      typing = false; skip = false;
      showProbe(step);
      return;
    }
    if (step.type === 'choice') {
      typing = false;
      els.text.innerHTML = '<p class="probeHint">该说话了。</p>';
      els.hint.classList.remove('on');
      showChoices();
      return;
    }
    els.text.classList.toggle('chapter-start', S.i === 0);
    if (step.fx && step.fx.length) step.fx.forEach(playFx);
    skip = false;
    typing = true;
    pageArmedAt = Date.now();
    await typePage(step.paras, tk);
    if (tk !== token) return;
    typing = false;
    els.hint.classList.add('on');
    updateScrollHint();
    save();
  }

  /* ---------- 探索区 ---------- */
  function showProbe(step) {
    els.text.innerHTML = '<p class="probeHint">' + (step.type === 'pick' ? '该说话了。' : '还能碰到的地方——') + '</p>';
    els.hint.classList.remove('on');
    const remain = step.opts.map((o, i) => i).filter(i => step.used.indexOf(i) < 0);

    remain.forEach((idx, n) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.style.animationDelay = (n * 70) + 'ms';
      const k = document.createElement('span');
      k.className = 'k'; k.textContent = '·';
      const t = document.createElement('span');
      t.className = 't'; t.textContent = step.opts[idx].label;
      b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', e => {
        e.stopPropagation();
        if (Date.now() - lastTouchAt < 350) return;
        openProbe(step, idx);
      });
      els.choices.appendChild(b);
    });

    if (step.type === 'pick') { return; }
    const g = document.createElement('button');
    g.type = 'button';
    g.className = 'choice ghost';
    g.textContent = remain.length ? '先不管这些' : '继续';
    g.addEventListener('click', e => {
      e.stopPropagation();
      if (Date.now() - lastTouchAt < 350) return;
      leaveProbe();
    });
    els.choices.appendChild(g);
    if (!remain.length) els.hint.classList.add('on');
  }

  function playBranch(step) {
    let pick = null;
    for (const o of step.opts) {
      if (pick === null || (typeof o.min === 'number' && S.effect >= o.min)) {
        if (typeof o.min === 'number' && S.effect >= o.min) { pick = o; break; }
      }
    }
    if (!pick) pick = step.opts[step.opts.length - 1];
    subMode = 'pick';
    sub = measurePages(pick.paras, false, true);
    subAt = 0;
    renderSub();
  }

  function openProbe(step, idx) {
    if (step.type === 'probe') { step.used.push(idx); save(); }
    if (step.type === 'pick' && step.opts[idx].effect) {
      S.effect += step.opts[idx].effect;
      updateRestraint();
      save();
    }
    subMode = step.type;
    sub = measurePages(step.opts[idx].paras, false, false);
    subAt = 0;
    renderSub();
  }

  async function renderSub() {
    const tk = ++token;
    const pg = sub[subAt];
    if (!pg) { endSub(); return; }
    if (pg.fx && pg.fx.length) pg.fx.forEach(playFx);
    if (pg.time) { S.clockText = pg.time; S.timeOn = true; applyAmbient(pg.time); }
    if (CONFIG.clock && S.timeOn && S.clockText) { els.clock.textContent = S.clockText; els.clock.classList.add('on'); }
    els.text.classList.remove('chapter-start');
    skip = false;
    typing = true;
    pageArmedAt = Date.now();
    els.choices.innerHTML = '';
    els.hint.classList.remove('on');
    updateBack();
    await typePage(pg.paras, tk);
    if (tk !== token) return;
    typing = false;
    els.hint.classList.add('on');
  }

  function endSub() {
    const m = subMode;
    sub = null; subMode = null;
    if (m === 'pick') {
      S.i++;
      if (S.i >= flow.length) return finish();
    }
    render(S.ch);
  }

  function leaveProbe() {
    sub = null;
    S.i++;
    if (S.i >= flow.length) return finish();
    render(S.ch);
  }

  /* ---------- 选择 ---------- */
  function showChoices() {
    els.choices.innerHTML = '';
    const ch = STORY[S.ch];
    ch.choices.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.style.animationDelay = (i * 90) + 'ms';
      const k = document.createElement('span');
      k.className = 'k'; k.textContent = c[0];
      const t = document.createElement('span');
      t.className = 't'; t.textContent = c[1];
      b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', e => {
        e.stopPropagation();
        if (Date.now() - lastTouchAt < 350) return;
        choose(c);
      });
      els.choices.appendChild(b);
    });
  }

  function choose(c) {
    const ch = STORY[S.ch];
    S.effect += (c[2] || 0);
    S.branch = c[0];
    els.choices.innerHTML = '';
    updateRestraint();
    const base = buildFlow(ch.common);
    flow = base.concat(buildFlow(ch.branches[c[0]]), buildFlow(ch.ending));
    S.i = base.length;
    render(S.ch);
  }

  /* ---------- 翻页 ---------- */
  function next() {
    if (typing) { skip = true; return; }
    if (sub) {
      subAt++;
      if (subAt >= sub.length) { endSub(); return; }
      renderSub();
      return;
    }
    const step = flow[S.i];
    if (!step || step.type !== 'page') return;
    const st = els.stage;
    const maxTop = st.scrollHeight - st.clientHeight;
    if (maxTop > 80 && st.scrollTop < maxTop - 24) {
      st.scrollTop = maxTop;          // 直接滚到底，不留在半路
      updateScrollHint();
      return;
    }
    S.i++;
    if (S.i >= flow.length) return finish();
    render(S.ch);
  }

  function back() {
    if (typing) { skip = true; return; }
    if (sub) { sub = null; subMode = null; render(S.ch); return; }
    if (S.i <= 0) return;
    S.i--;
    render(S.ch);
  }


  function updateBack() {
    els.back.classList.toggle('on', (S.i > 0 || !!sub) && !typing);
  }

  function updateScrollHint() {
    const st = els.stage;
    const maxTop = st.scrollHeight - st.clientHeight;
    if (maxTop > 24 && st.scrollTop < maxTop - 24) {
      els.hint.textContent = '↓ 还有';
      els.hint.classList.add('on');
    } else {
      els.hint.textContent = '轻触继续';
    }
  }

  /* ---------- 章节切换 ---------- */
  function gradeOf() {
    const e = S.effect || 0;
    if (e >= 24) return { n: '重伤 · 墙', t: '他解开了锁，出门去买药。\n你爬到窗边，拉开窗帘，看见的是钉死的木板。\n这间房从一开始就没有出口。他松手的那一刻，你才看清。' };
    if (e >= 18) return { n: '较重伤 · 三天', t: '他给了你一个三天。\n没有医生，没有依据，只是他现在拿得出来的一个期限。\n三天之后，没有第四天。' };
    if (e >= 12) return { n: '轻伤 · 日常', t: '你留在了日常里。\n粥、药、水杯，每一样都被放在他算好的位置。\n你连今天是星期几都不再问了。' };
    return { n: '轻微伤 · 留灯', t: '他检查过你没有大碍，把水杯往你手边推近了一点。\n你的自由，只剩这一杯水的长度。' };
  }

  function showToc() {
    els.tocList.innerHTML = '';
    STORY.forEach(function (c, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tocitem';
      const n = document.createElement('span');
      n.className = 'tocnum';
      n.textContent = c.num || '';
      const t = document.createElement('span');
      t.textContent = c.num ? (c.title || '') : (c.title || '');
      b.appendChild(n); b.appendChild(t);
      if (i === S.ch) {
        const now = document.createElement('span');
        now.className = 'tocnow';
        now.textContent = '在读';
        b.appendChild(now);
      }
      b.addEventListener('click', function () { jumpTo(i); });
      els.tocList.appendChild(b);
    });
    els.ending.classList.add('hidden');
    els.toc.classList.remove('hidden');
    els.toc.style.zIndex = '60';
  }

  function jumpTo(i) {
    token++;
    sub = null; subMode = null;
    els.toc.classList.add('hidden');
    els.ending.classList.add('hidden');
    els.title.classList.add('hidden');
    els.choices.innerHTML = '';
    S.ch = i; S.i = 0; S.branch = null; S.used = {};
    startChapter();
  }

  function finish() {
    save();
    if (S.ch + 1 < STORY.length) {
      const nx = S.ch + 1;
      els.interNum.textContent = STORY[nx].num;
      els.interName.textContent = STORY[nx].title;
      els.inter.classList.remove('hidden');
      interShownAt = Date.now();
      els.inter.onclick = function () {
        if (Date.now() - interShownAt < 450) return;
        els.inter.classList.add('hidden');
        els.inter.onclick = null;
        S.ch = nx; S.i = 0; S.branch = null; S.used = {};
        startChapter();
      };
      return;
    }
    S.done = true;
    save();
    const g = gradeOf();
    if (els.endName) els.endName.textContent = g.n;
    if (els.endingText) els.endingText.textContent = g.t;
    els.ending.classList.remove('hidden');
    els.bar.style.width = '100%';
    els.statusbar.classList.remove('on');
  }

  function startChapter(preserve) {
    if (!preserve) S.used = {};
    const ch = STORY[S.ch];
    els.choices.innerHTML = '';
    if (ch.choices && ch.choices.length) {
      if (S.branch) {
        const base = buildFlow(ch.common);
        flow = base.concat(buildFlow(ch.branches[S.branch]), buildFlow(ch.ending));
        if (!preserve) S.i = Math.min(S.i, flow.length - 1);
      } else {
        flow = buildFlow(ch.common).concat([{ type: 'choice' }]);
      }
    } else {
      flow = buildFlow(ch.common);
    }
    render(-1);
  }

  /* ---------- 流程 ---------- */
  function reset() {
    token++;
    sub = null; subMode = null; interShownAt = 0;
    els.inter.classList.add('hidden');
    S = { ch: 0, i: 0, branch: null, effect: 0, done: false, statusOn: false, timeOn: false, clockText: null, used: {} };
    try { localStorage.removeItem(SAVE); } catch (e) {}
    els.ending.classList.add('hidden');
    els.title.classList.add('hidden');
    els.choices.innerHTML = '';
    els.text.innerHTML = '';
    updateRestraint();
    sub = null;
    startMusic();
    startChapter();
  }

  function home() {
    els.ending.classList.add('hidden');
    els.title.classList.remove('hidden');
    els.btnContinue.style.display = (load() && !S.done) ? '' : 'none';
  }

  /* ---------- 事件 ---------- */
  let tx = 0, ty = 0, tt = 0;
  let lastTouchAt = 0;
  let pageArmedAt = 0;

  els.stage.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    tx = t.clientX; ty = t.clientY; tt = Date.now();
  }, { passive: true });

  els.stage.addEventListener('touchend', e => {
    lastTouchAt = Date.now();
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty, dt = Date.now() - tt;
    if (dt > 700) return;
    if (Math.abs(dx) > 55 && Math.abs(dy) < 50) { dx < 0 ? back() : next(); return; }
    if (Date.now() - pageArmedAt < 320) return;   // 新页面刚出现，忽略连点
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { typing ? (skip = true) : next(); }
  }, { passive: true });

  els.stage.addEventListener('scroll', updateScrollHint, { passive: true });

  els.stage.addEventListener('click', () => {
    if (Date.now() - lastTouchAt < 600) return;   // 触摸后的合成点击，忽略
    if (Date.now() - pageArmedAt < 320) return;   // 刚翻页，忽略连点
    if (typing) skip = true; else next();
  });
  els.hint.addEventListener('click', next);

  document.addEventListener('keydown', e => {
    if (!els.title.classList.contains('hidden')) return;
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); typing ? (skip = true) : next(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
    if (e.key === 'Escape') els.title.classList.add('hidden');
  });

  els.back.addEventListener('click', function (e) { e.stopPropagation(); back(); });

  if (els.mHint) {
    els.mHint.addEventListener('click', function (e) {
      e.stopPropagation();
      muted = false;
      try { localStorage.setItem(MUSIC_KEY, '0'); } catch (err) {}
      setMuteIcon();
      startMusic();
    });
    els.bgm.addEventListener('playing', function () {
      els.mHint.classList.add('hidden');
    });
    els.bgm.addEventListener('error', function () {
      els.mHint.classList.remove('hidden');
      els.mHint.textContent = '音乐没加载出来（检查 assets/bgm.m4a 是否上传）';
    });
  }
  els.music.addEventListener('click', toggleMusic);

  var firstGesture = (function () {
    var done = false;
    return function () {
      if (done) return;
      done = true;
      startMusic();
    };
  })();
  ['pointerdown', 'touchstart', 'click'].forEach(function (ev) {
    document.addEventListener(ev, firstGesture, { passive: true });
  });
  els.bgm.addEventListener('error', () => { els.music.classList.add('hidden'); });

  els.btnStart.addEventListener('click', reset);
  els.btnContinue.addEventListener('click', () => { els.title.classList.add('hidden'); startMusic(); startChapter(true); });
  $('#btnToc').addEventListener('click', showToc);
  $('#btnTocBack').addEventListener('click', function () {
    els.toc.classList.add('hidden');
    els.ending.classList.remove('hidden');
  });
  $('#btnAgain').addEventListener('click', reset);
  $('#btnHome').addEventListener('click', home);

  /* ---------- 启动 ---------- */
  try { muted = localStorage.getItem(MUSIC_KEY) === '1'; } catch (e) {}
  els.music.classList.remove('hidden');
  setMuteIcon();
  try { startMusic(); } catch (e) {}
  setTimeout(function () {
    if (els.mHint && els.bgm.paused) { els.mHint.classList.remove('hidden'); }
  }, 1200);
  updateBack();

  updateRestraint();

  const has = load();
  els.btnContinue.style.display = (has && !S.done) ? '' : 'none';
})();
</script>
</body>
</html>
